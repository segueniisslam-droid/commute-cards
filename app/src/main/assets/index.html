// ---------- Study session ----------
function startSession(deckId) {
  ensureSettings();
  const decks = deckId ? S.decks.filter(d => d.id === deckId) : topicDecks();
  const pool = decks.flatMap(d => d.cards.map(c => ({ c, d })));
  if (!pool.length) return;
  const size = S.settings.size || Infinity;
  // 1) reviews that are due, most overdue first
  let q = reviewsDue(decks).sort((a, b) => a.c.due - b.c.due).slice(0, size);
  // 2) fill remaining slots with new cards, mixed across topics, within today's limit
  const room = Math.min(size - q.length, newLeftToday());
  if (room > 0) q = q.concat(mixNew(decks, room));
  let practice = false;
  if (!q.length) { // nothing due: free practice on cards already learned (or new ones if none learned yet)
    const learned = pool.filter(x => !isNew(x.c));
    q = shuffle(learned.length ? learned : pool).slice(0, S.settings.size || 20); practice = true;
  }
  q = shuffle(q);
  session = { queue: q, total: q.length, done: 0, correct: 0, combo: 0, bestCombo: 0, xp: 0, misses: 0, newBadges: [], pool, deckId, practice, flipped: false, answered: null, choices: null };
  view = { name: 'study' }; render();
}

function renderStudy() {
  const s = session; if (!s) return go({ name: 'home' });
  if (!s.queue.length) return renderDone();
  const { c } = s.queue[0];
  const mode = S.settings.mode === 'mc' && s.pool.length < 4 ? 'flash' : S.settings.mode;
  const pct = Math.round(s.done / s.total * 100);
  const head = `<div class="top"><button class="icon-btn" id="quit" aria-label="End session">✕</button>
    <div class="progress"><i style="width:${pct}%"></i></div><span class="small muted" style="min-width:40px;text-align:right">${s.done}/${s.total}</span></div>
    <div class="row" style="margin:-8px 0 4px;min-height:26px"><span class="xpchip">+${s.xp} XP</span><span class="spacer"></span>${s.combo >= 3 ? `<span class="combo">\uD83D\uDD25 ${s.combo} combo${comboMult(s.combo) > 1 ? ' \u00B7 \u00D7' + comboMult(s.combo) : ''}</span>` : ''}</div>`;
  if (mode === 'flash') {
    $app.innerHTML = head + `<div class="stage">
      <div class="flash ${s.flipped?'flipped':''}" id="card"><div class="flash-inner">
        <span class="swipe-tag l" id="tl">AGAIN</span><span class="swipe-tag r" id="tr">GOT IT</span>
        <div class="face front"><span class="label">Question</span><div class="content">${esc(c.front)}</div><div class="hint">Tap to flip</div></div>
        <div class="face back"><span class="label">Answer</span><div class="q-small">${esc(c.front)}</div><div class="content">${esc(c.back)}</div><div class="hint">Swipe ← again · got it →</div></div>
      </div></div>
      ${s.flipped ? explainBtn(c) + `<div class="grades">${['Again','Hard','Good','Easy'].map((l, g) => `<button class="grade g${g}" data-g="${g}">${l}<small>${ivlLabel(c, g)}</small></button>`).join('')}</div>`
        : `<button class="btn primary" id="show">Show answer</button>`}
    </div>`;
    const card = $app.querySelector('#card');
    const flip = () => { s.flipped = !s.flipped; render(); };
    const show = $app.querySelector('#show'); if (show) show.onclick = flip;
    $app.querySelectorAll('[data-g]').forEach(b => b.onclick = () => answer(+b.dataset.g));
    bindSwipe(card, flip);
  } else if (mode === 'mc') {
    if (!s.choices) {
      const others = pickDistractors(c, s.queue[0].d);
      s.choices = shuffle([c.back, ...others]);
    }
    const a = s.answered;
    $app.innerHTML = head + `<div class="stage">
      <div class="qbox"><div class="small muted" style="margin-bottom:8px">Pick the answer</div><div class="content">${esc(c.front)}</div></div>
      <div class="choices">${s.choices.map((t, i) => { let cls = ''; if (a) { if (t === c.back) cls = 'right'; else if (i === a.pick) cls = 'wrong'; }
        return `<button class="choice ${cls}" data-i="${i}" ${a?'disabled':''}>${esc(t)}</button>`; }).join('')}</div>
      ${a ? explainBtn(c) + `<button class="btn primary" id="next">Next</button>` : ''}
    </div>`;
    $app.querySelectorAll('[data-i]').forEach(b => b.onclick = () => { const i = +b.dataset.i; s.answered = { pick: i, ok: s.choices[i] === c.back }; render(); });
    const nx = $app.querySelector('#next'); if (nx) nx.onclick = () => answer(s.answered.ok ? 2 : 0);
  } else {
    const a = s.answered;
    $app.innerHTML = head + `<div class="stage">
      <div class="qbox"><div class="small muted" style="margin-bottom:8px">Type the answer</div><div class="content">${esc(c.front)}</div></div>
      ${a ? `<div class="feedback ${a.ok?'ok':'no'}"><div style="font-weight:700;margin-bottom:4px">${a.ok ? (a.exact ? 'Correct!' : 'Close enough!') : 'Not quite'}</div>
          ${a.typed ? `<div class="small muted">You wrote: ${esc(a.typed)}</div>` : ''}<div style="margin-top:6px">${esc(c.back)}</div></div>
        ${explainBtn(c)}<div class="kbd-row">${a.ok ? '' : '<button class="btn" id="override">I was right</button>'}<button class="btn primary" id="next" style="${a.ok?'grid-column:1/-1':''}">Next</button></div>`
      : `<input id="ans" placeholder="Your answer" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done">
        <div class="kbd-row"><button class="btn" id="idk">Show me</button><button class="btn primary" id="check">Check</button></div>`}
    </div>`;
    if (!a) {
      const inp = $app.querySelector('#ans'); setTimeout(() => inp.focus(), 30);
      const check = () => { const r = compare(inp.value, c.back); s.answered = { typed: inp.value.trim(), ok: r.ok, exact: r.exact }; render(); };
      $app.querySelector('#check').onclick = check; inp.onkeydown = e => { if (e.key === 'Enter') check(); };
      $app.querySelector('#idk').onclick = () => { s.answered = { typed: '', ok: false }; render(); };
    } else {
      $app.querySelector('#next').onclick = () => answer(a.ok ? 2 : 0);
      const ov = $app.querySelector('#override'); if (ov) ov.onclick = () => answer(2);
    }
  }
  const exb = $app.querySelector('#explain'); if (exb) exb.onclick = () => explainSheet(c);
  $app.querySelector('#quit').onclick = () => { if (s.done) renderDone(true); else go(s.deckId ? { name: 'deck', id: s.deckId } : { name: 'home' }); };
}

function norm(t) { return t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\p{L}\p{N}\s]/gu, ' ').replace(/\b(the|a|an)\b/g, ' ').replace(/\s+/g, ' ').trim(); }
function lev(a, b) { const m = a.length, n = b.length; if (!m) return n; if (!n) return m; let p = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) { const c = [i]; for (let j = 1; j <= n; j++) c[j] = Math.min(p[j] + 1, c[j - 1] + 1, p[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); p = c; } return p[n]; }
function compare(typed, answer) {
  const a = norm(typed), b = norm(answer); if (!a) return { ok: false };
  if (a === b) return { ok: true, exact: true };
  const tol = Math.max(1, Math.floor(b.length * 0.2));
  if (lev(a, b) <= tol) return { ok: true, exact: false };
  // long answers: accept if most key words are present
  const words = b.split(' ').filter(w => w.length > 3); if (words.length >= 3) {
    const tw = new Set(a.split(' ')); const hit = words.filter(w => tw.has(w) || [...tw].some(t => t.length > 3 && lev(t, w) <= 1)).length;
    if (hit / words.length >= 0.7) return { ok: true, exact: false };
  }
  return { ok: false };
}

function answer(g) {
  const s = session; const item = s.queue.shift();
  if (!s.practice || (!isNew(item.c) && (g === 0 || item.c.due <= Date.now()))) grade(item.c, g);
  else { const d = today(); S.log[d] = (S.log[d] || 0) + 1; }
  if (g > 0) { s.combo++; s.bestCombo = Math.max(s.bestCombo, s.combo); } else { s.combo = 0; s.misses++; buzz([50, 30, 50]); }
  const mult = g > 0 ? comboMult(s.combo) : 1;
  const xp = Math.round([2, 6, 10, 12][g] * mult); s.xp += xp; award(xp);
  floatXP(`+${xp} XP${mult > 1 ? ' ×' + mult : ''}`); if (g > 0) buzz(12);
  if (s.combo === 10) unlock('combo10'); if (s.combo === 25) unlock('combo25');
  if (g === 0) s.queue.splice(Math.min(3, s.queue.length), 0, item); // see it again soon
  else { s.done++; if (g >= 2) s.correct++; }
  checkBadges(); save();
  s.flipped = false; s.answered = null; s.choices = null;
  render();
}

function bindSwipe(el, onTap) {
  let x0 = null, y0 = 0, dx = 0, moved = false;
  const inner = el.querySelector('.flash-inner'), tl = el.querySelector('#tl'), tr = el.querySelector('#tr');
  el.addEventListener('pointerdown', e => { x0 = e.clientX; y0 = e.clientY; dx = 0; moved = false; inner.style.transition = 'none'; });
  el.addEventListener('pointermove', e => {
    if (x0 === null) return; dx = e.clientX - x0; if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(e.clientY - y0)) moved = true;
    if (!moved || !session.flipped) return;
    inner.style.transform = `rotateY(180deg) translateX(${-dx}px) rotate(${-dx / 25}deg)`;
    tl.style.opacity = dx < -30 ? Math.min(1, (-dx - 30) / 60) : 0; tr.style.opacity = dx > 30 ? Math.min(1, (dx - 30) / 60) : 0;
  });
  const end = () => {
    if (x0 === null) return; x0 = null; inner.style.transition = ''; inner.style.transform = '';
    tl.style.opacity = 0; tr.style.opacity = 0;
    if (!moved) return onTap();
    if (session.flipped && Math.abs(dx) > 90) answer(dx > 0 ? 2 : 0);
  };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', () => { x0 = null; inner.style.transition = ''; inner.style.transform = ''; tl.style.opacity = tr.style.opacity = 0; });
}

function renderDone(early) {
  const s = session;
  if (!s.finished) {
    s.finished = true;
    if (s.done) unlock('first');
    const perfect = !early && s.total >= 10 && s.misses === 0;
    if (perfect) { unlock('perfect'); const bonus = 50; s.xp += bonus; award(bonus); s.bonus = bonus; }
    checkBadges(); save();
    if (perfect || (s.newBadges && s.newBadges.length)) confetti();
  }
  const acc = s.done ? Math.round(s.correct / s.done * 100) : 0;
  const leftDue = s.deckId ? dueCount(S.decks.filter(d => d.id === s.deckId)) : dueCount(topicDecks());
  const L = levelInfo(S.game.xp);
  $app.innerHTML = `<div class="stage"><div class="done">
    <div class="big">${early ? '🚇' : s.bonus ? '💯' : acc >= 80 ? '🎉' : '💪'}</div>
    <h1 style="margin-top:14px">${early ? 'Good stop' : s.bonus ? 'Perfect ride!' : 'Session done'}</h1>
    <div class="bigscore" style="font-size:44px;margin-top:10px;color:var(--accent)">+${s.xp} XP</div>
    ${s.bonus ? `<div class="small muted">includes +${s.bonus} perfect-ride bonus</div>` : ''}
    <p class="muted">${s.done} card${s.done===1?'':'s'} · ${acc}% right · best combo ${s.bestCombo}<br>${streak()}-day streak 🔥</p>
    <div style="max-width:320px;margin:0 auto;text-align:left"><div class="small row"><b>Lvl ${L.lvl} ${esc(L.title)}</b><span class="spacer"></span><span class="muted">${L.into}/${L.need}</span></div>
      <div class="progress" style="height:8px;margin-top:6px"><i style="width:${L.into / L.need * 100}%"></i></div></div>
    ${badgeStrip(s.newBadges)}
  </div>
  ${leftDue ? `<button class="btn primary" id="more">Keep going (${leftDue} due)</button>` : ''}
  <button class="btn express" id="exp">⚡ Express round</button>
  <button class="btn" id="home">Back to decks</button></div>`;
  const more = $app.querySelector('#more'); if (more) more.onclick = () => startSession(s.deckId);
  $app.querySelector('#exp').onclick = () => startExpress(s.deckId);
  $app.querySelector('#home').onclick = () => go(s.deckId ? { name: 'deck', id: s.deckId } : { name: 'home' });
}

// keyboard shortcuts (for desktop)
document.addEventListener('keydown', e => {
  if (view.name !== 'study' || !session || !session.queue.length || document.querySelector('.modal-back')) return;
  if (S.settings.mode !== 'flash' && !(S.settings.mode === 'mc' && session.pool.length < 4)) return;
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); if (!session.flipped) { session.flipped = true; render(); } }
  else if (session.flipped && '1234'.includes(e.key)) answer(+e.key - 1);
});

save(false);
render();
})();
</script>
