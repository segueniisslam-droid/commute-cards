":"Doubling time","d":"years for money to grow 2x"}],"use":"Handy for sanity-checking growth assumptions and returns without a calculator.","example":"Your investment earns 8% a year.\n72 ÷ 8 = 9\nYour money doubles in about 9 years. (Exact: 1.08⁹ = 2.0)","tip":"Most accurate for rates between about 6% and 10%.","like":"A quick trick: divide 72 by your interest rate. At 8%, your money doubles in about 9 years."},{"plain":"How long it takes for the cash coming back from an investment to add up to what you paid.","terms":[{"t":"Payback period","d":"years to recover the initial cost"},{"t":"Cumulative cash flow","d":"running total of cash received so far"},{"t":"Time value of money","d":"money later is worth less than money now"}],"use":"A simple way to judge how risky or slow a project is, often used alongside NPV.","example":"You invest $100. It returns $40 a year.\nAfter year 1: $40 back; year 2: $80; year 3: $120\nYou hit $100 halfway through year 3\nPayback ≈ 2.5 years","tip":"It ignores the time value of money and any cash after payback, so it's weaker than NPV.","like":"You spend $100 on a coffee machine that saves you $40 a year. After about 2.5 years it has paid for itself."},{"plain":"How a company is funded: how much comes from borrowing (debt) and how much from owners (equity).","terms":[{"t":"Debt","d":"loans and bonds that must be repaid with interest"},{"t":"Equity","d":"shareholders' money plus retained profits"},{"t":"Leverage","d":"the use of debt"}],"use":"It drives WACC, risk and valuation, and it's central in leveraged buyouts (LBOs).","example":"A company is funded with $40m of loans and $60m of shareholders' money.\nCapital structure = 40% debt / 60% equity","tip":"Some debt can lower WACC (thanks to the tax shield), but too much raises the risk of default.","like":"How you paid for your house: part mortgage (debt), part your own savings (equity)."},{"plain":"Corporate finance is about three big decisions: which projects to invest in, how to pay for them, and what to do with the profits.","terms":[{"t":"Capital budgeting","d":"choosing which projects to invest in (using NPV, IRR)"},{"t":"Capital structure","d":"deciding the mix of debt and equity"},{"t":"Payout","d":"deciding on dividends or share buybacks"}],"use":"All three aim at the same goal: increasing the value of the company for shareholders.","example":"A company asks:\n\"Should we build a new factory?\" → investing decision\n\"Should we pay for it with a loan or new shares?\" → financing decision\n\"Should we pay a dividend or reinvest profits?\" → payout decision","tip":"If an exam asks what corporate finance is about, these three decisions are the answer.","like":"Like running your own life: what to spend on (a car? a course?), how to pay for it (savings or a loan?), and what to do with leftover money (spend it or reinvest it?)."},{"plain":"The real yearly interest rate once you account for interest being added more than once a year.","terms":[{"t":"Nominal rate","d":"the stated yearly rate (APR)"},{"t":"m","d":"how many times a year interest is added (12 = monthly)"},{"t":"EAR","d":"effective annual rate"}],"use":"Lets you compare loans or investments that compound at different frequencies.","example":"A card charges 12% a year, compounded monthly.\nMonthly rate = 12% ÷ 12 = 1%\nEAR = (1.01)¹² − 1 = 12.68%\nSo you really pay 12.68% a year, not 12%.","tip":"The more often interest compounds, the higher the effective rate.","like":"A credit card says \"12% a year\" but adds 1% every month. Because the interest stacks up, you really pay 12.68% a year."}],"fmva-excel":[{"plain":"Both work out what future cash flows are worth today. NPV assumes they're exactly one year apart; XNPV lets you give the real date of each one, so it's more accurate.","terms":[{"t":"XNPV(rate, values, dates)","d":"rate = discount rate; values = the cash flows; dates = the date of each cash flow"},{"t":"NPV(rate, values)","d":"assumes equal periods, with the first value one full period from today"}],"use":"Real deals don't happen on neat yearly dates (e.g. a deal closes in March), so analysts prefer XNPV.","example":"Your cash flows are in cells B2 to B4: −1,000 on 1 Mar 2025, +600 on 1 Mar 2026, +600 on 1 Sep 2026. Their dates are in A2 to A4.\nType =XNPV(10%, B2:B4, A2:A4)\nExcel discounts each amount by its exact time from the first date.","tip":"NPV() discounts the very first value too, so leave the day-0 investment out of NPV() and add it separately.","like":"NPV assumes payments arrive exactly once a year. XNPV lets you type the real dates, like a first payment in March and the next in September."},{"plain":"The return (IRR) of an investment whose cash flows happen on specific, uneven dates.","terms":[{"t":"XIRR(values, dates)","d":"values = the cash flows (at least one negative and one positive); dates = the date of each"},{"t":"IRR","d":"the rate that makes NPV = 0"}],"use":"Used for private equity and real-estate returns, where money goes in and out on irregular dates.","example":"You invest −1,000 on 1 Jan 2025 and receive +1,100 on 1 Jan 2026. Amounts are in B2:B3, dates in A2:A3.\nType =XIRR(B2:B3, A2:A3)\nResult: 10%","tip":"The first value is usually the negative investment on the earliest date.","like":"Your real return on money that went in and out on random dates, like topping up a savings app whenever you felt like it."},{"plain":"Works out the fixed payment you'd make every period to pay off a loan, including interest.","terms":[{"t":"PMT(rate, nper, pv)","d":"rate = interest rate per period; nper = number of payments; pv = loan amount today"},{"t":"Period","d":"month, quarter or year; rate and nper must use the same one"}],"use":"Used to build loan and lease schedules, or to check mortgage payments in a model.","example":"You borrow $10,000 at 6% a year and repay monthly over 3 years.\nRate per month = 6% ÷ 12 = 0.5%; payments = 36\nType =PMT(6%/12, 36, 10000)\nResult: −$304.22 a month (negative = cash going out)","tip":"If you use a yearly rate with monthly payments, the answer will be badly wrong.","like":"The car dealer's answer to \"So how much is that a month?\""},{"plain":"A two-step lookup. MATCH finds which row your item is in; INDEX then fetches the value from that row in the column you want.","terms":[{"t":"MATCH(item, list, 0)","d":"returns the position of the item in the list; 0 means \"exact match\""},{"t":"INDEX(column, position)","d":"returns the value at that position in a column"}],"use":"The flexible way to pull data from a table into a model. Unlike VLOOKUP it can look to the left and doesn't break when columns are added.","example":"Column A lists fruits (Pear, Kiwi, Apple, Plum) and column C lists their prices. You want Apple's price.\nMATCH(\"Apple\", A2:A5, 0) → 3 (Apple is the 3rd item)\nINDEX(C2:C5, 3) → $0.80\nCombined: =INDEX(C2:C5, MATCH(\"Apple\", A2:A5, 0))","tip":"Always use 0 at the end of MATCH, or it may return a wrong, \"approximate\" match.","like":"Like finding a friend's number in a list: first find which row their name is on (MATCH), then read across to the number in that row (INDEX)."},{"plain":"A newer, simpler lookup: tell it what to find, where to look, and which column to return the answer from.","terms":[{"t":"XLOOKUP(find, look_in, return_from)","d":"find = the value you're looking for; look_in = the column to search; return_from = the column with the answer"},{"t":"VLOOKUP","d":"the older lookup that can only look to the right"}],"use":"Pulling numbers from data tables into a model, e.g. a company's revenue from a list of peers.","example":"Column A has fruit names; column C has prices. You want Apple's price.\nType =XLOOKUP(\"Apple\", A2:A5, C2:C5)\nResult: $0.80","tip":"It does an exact match by default, but it doesn't exist in older Excel versions; there, use INDEX + MATCH.","like":"Like asking your phone: \"Find Apple and give me the price next to it.\" One step."},{"plain":"Adds up numbers, but only in rows that meet all your conditions.","terms":[{"t":"SUMIFS(sum_range, criteria_range1, criteria1, …)","d":"sum_range = the numbers to add; criteria_range = the column to check; criteria = the condition"},{"t":"SUMIF","d":"the single-condition version"}],"use":"Totaling raw data by category, e.g. revenue by region and year, to feed a model or dashboard.","example":"Column A = region, column B = year, column C = sales. You want total East sales in 2025.\nType =SUMIFS(C:C, A:A, \"East\", B:B, 2025)\nExcel adds only the rows where region is East AND year is 2025.","tip":"In SUMIFS the numbers to add come FIRST; in the older SUMIF they come LAST.","like":"Like adding up only the receipts that are both \"food\" AND \"March\" from a shoebox full of receipts."},{"plain":"Normally when you copy a formula, its cell references move with it. Putting $ signs in front of the column letter and row number locks the reference so it always points to the same cell.","terms":[{"t":"$A$1","d":"column and row both locked"},{"t":"A$1","d":"only the row locked"},{"t":"$A1","d":"only the column locked"},{"t":"Relative reference (A1)","d":"moves when copied"}],"use":"Essential in models: e.g. pointing a whole row of formulas at one tax-rate cell so you can change it in one place.","example":"Cell C2 holds the tax rate (25%). Row 4 has profits for 3 years in B4, C4, D4.\nIn B5 you type =B4*$C$2 and copy it right.\nC5 becomes =C4*$C$2 and D5 becomes =D4*$C$2: the profit moves, the tax rate stays put.","tip":"Without the $ signs, the copied formula would point to D2, E2… (empty cells) and give wrong answers.","like":"Pinning a note to the wall: when you copy the formula, the pinned cell stays put while everything else moves."},{"plain":"A keyboard shortcut that adds or removes the $ signs on a cell reference while you're typing a formula.","terms":[{"t":"F4","d":"cycles through the 4 reference types (Windows)"},{"t":"Cmd + T","d":"the same thing on a Mac"},{"t":"$ sign","d":"locks the column or row when copying"}],"use":"Saves lots of time when building models, where you constantly lock references to input cells.","example":"You type =B4*C2 and the cursor is on C2.\nPress F4 once → $C$2 (fully locked)\nAgain → C$2 (row locked)\nAgain → $C2 (column locked)\nAgain → C2 (back to normal)","tip":"On many laptops you need to press Fn + F4.","like":"A shortcut key that adds the \"pins\" ($ signs) for you, instead of typing them."},{"plain":"Wraps a formula so that if it produces an error, Excel shows a value you choose (like 0 or a blank) instead of the error.","terms":[{"t":"IFERROR(formula, fallback)","d":"formula = what you want to calculate; fallback = what to show if it errors"},{"t":"Error values","d":"#DIV/0!, #N/A, #VALUE! and similar"}],"use":"Keeps outputs and dashboards clean, e.g. when growth rates divide by a zero year or a lookup can't find a company.","example":"You calculate margin as profit ÷ revenue, but some months have zero revenue, which gives #DIV/0!.\nInstead type =IFERROR(profit ÷ revenue, 0)\nThose months now show 0 instead of an error.","tip":"Use it sparingly: it can also hide genuine mistakes in your model.","like":"A plan B: if the formula breaks, show this instead, like a \"back in 5 minutes\" sign instead of a locked door."},{"plain":"An Excel tool that runs your model many times, once for each input value you list, and shows all the results in a grid.","terms":[{"t":"One-variable data table","d":"tests one input (e.g. different growth rates)"},{"t":"Two-variable data table","d":"tests two inputs at once, one along the top and one down the side"},{"t":"Row / column input cell","d":"the model cells the table changes"}],"use":"The classic use is a DCF sensitivity table showing share price for different WACCs and growth rates.","example":"Put WACC values (7%, 8%, 9%) across the top and growth rates (1.5%, 2%, 2.5%) down the side, with the share price formula in the corner.\nData → What-If Analysis → Data Table\nRow input = your WACC cell; Column input = your growth cell\nExcel fills in the share price for all 9 combinations.","tip":"The table must be on the same sheet as the input cells, and big tables slow Excel down.","like":"Asking \"what if?\" nine times at once: my car payment at 3%, 4% or 5% interest, over 3, 4 or 5 years, all answers in one grid."},{"plain":"You tell Excel the result you want, and it works backwards to find the input that produces it.","terms":[{"t":"Set cell","d":"the result cell (must contain a formula)"},{"t":"To value","d":"the target you want"},{"t":"By changing cell","d":"the input Excel is allowed to change"}],"use":"Finding break-even points or the assumption needed to hit a target, like the growth needed for a $50 share price.","example":"Your model shows a $42 share price with 3% growth. What growth gives $50?\nData → What-If Analysis → Goal Seek\nSet cell = share price; To value = 50; By changing = growth rate\nExcel finds, say, 4.6% growth.","tip":"It can only change one input. For several inputs at once, use Solver.","like":"Working backwards: \"I want $10,000 saved by December. How much do I need to put away each month?\" Excel finds the number."},{"plain":"A circular reference is when a formula ends up depending on its own result. In models it usually comes from interest: interest depends on how much debt and cash you have, which depends on cash flow, which depends on interest.","terms":[{"t":"Circular reference","d":"a calculation loop"},{"t":"Iterative calculation","d":"an Excel setting that repeats the loop until the numbers settle"},{"t":"Circuit breaker","d":"an on/off switch cell that can break the loop"}],"use":"Common in 3-statement models that calculate interest on average balances.","example":"In settings, turn on iterative calculation.\nAdd a switch cell: 1 = on, 0 = off.\nInterest formula: =IF(switch = 1, rate × average debt, 0)\nIf the model ever fills with errors, set the switch to 0, then back to 1.","tip":"Never leave a circular reference you didn't intend: Excel's warning usually means a mistake.","like":"A chicken-and-egg problem: your interest depends on how much cash you have, but your cash depends on how much interest you pay."},{"plain":"Blue font tells anyone using the model: \"this number was typed in by hand, it's an assumption you can change.\"","terms":[{"t":"Hard-code","d":"a number typed directly, not calculated"},{"t":"Assumption","d":"an input the model is built on, like a growth rate"}],"use":"Makes it obvious where the inputs are, so others can test different scenarios without breaking formulas.","example":"Revenue growth 5%, tax rate 25% and the starting cash balance are typed in blue.\nEverything calculated from them is in black.","tip":"It's an industry convention: use it consistently so anyone can read your model.","like":"Like writing your own guesses in pencil: blue numbers are the ones you typed in and can change."},{"plain":"Black font means \"this cell is a formula calculated from other cells: don't type over it.\"","terms":[{"t":"Formula","d":"a calculation starting with ="},{"t":"Hard-code","d":"a typed number (shown in blue)"}],"use":"Tells users which cells are outputs and should never be overwritten.","example":"Next year's revenue = this year's revenue × (1 + growth).\nThat cell is black because it's calculated.\nThe growth rate it uses is blue because you typed it.","tip":"Typing a number over a black formula cell is one of the most common ways models break.","like":"Black cells are worked out by the calculator. Don't write over them."},{"plain":"Green font means the cell pulls its number from a different sheet in the same file.","terms":[{"t":"Link","d":"a formula pointing to another sheet, e.g. =Assumptions!B4"},{"t":"Sheet","d":"a tab in the Excel workbook"}],"use":"Helps people trace where numbers come from in models spread across many tabs.","example":"On your valuation tab, a cell shows last year's revenue by linking to the income statement tab.\nIt's green, so you know the number lives on another sheet.","tip":"Some firms use red for links to other files; follow your firm's guide.","like":"Green cells are like \"see page 3\": they bring a number over from another tab."},{"plain":"Gives you the last day of a month, counting a chosen number of months forward or backward from a starting date.","terms":[{"t":"start_date","d":"the date you count from, e.g. 15 Jan 2025"},{"t":"months","d":"how many months to move: 0 = the same month, 1 = next month, −1 = last month"},{"t":"Month-end","d":"the last calendar day (31 Jan, 28 Feb, 31 Mar…)"}],"use":"Financial models run on month-ends or quarter-ends. EOMONTH builds that timeline automatically, so you never have to type dates or worry about 30 vs 31 days.","example":"Your model starts on 15 January 2025.\n=EOMONTH(\"15-Jan-2025\", 0) → 31 Jan 2025 (end of the same month)\n=EOMONTH(\"15-Jan-2025\", 1) → 28 Feb 2025 (end of next month)\n=EOMONTH(\"15-Jan-2025\", 3) → 30 Apr 2025\nFor a timeline, put 31 Jan in the first cell, then =EOMONTH(previous cell, 1) in each next cell.","tip":"Excel may show a number like 45688 instead of a date. That's just formatting; change the cell format to Date.","like":"A calendar that always lands on the last day of a month: start at 15 January, jump 1 month and land on 28 February; jump 3 and land on 30 April."},{"plain":"A shortcut that jumps from a formula to the cells it uses, so you can check where its numbers come from.","terms":[{"t":"Ctrl + [","d":"jump to precedents (the cells a formula uses)"},{"t":"Precedents","d":"cells that feed into a formula"},{"t":"F5 then Enter","d":"jump back to where you started"}],"use":"Auditing models: checking that a formula is pulling the right numbers, which is a big part of a junior analyst's job.","example":"You're on a cell that calculates profit as revenue × margin.\nPress Ctrl + [\nExcel jumps to and highlights the revenue and margin cells it uses, even on another sheet.","tip":"Ctrl + ] does the opposite: it jumps to the cells that USE the current cell.","like":"Like tapping a link that takes you to where a number came from."},{"plain":"A shortcut that instantly adds a SUM formula for the numbers above the cell (or to its left).","terms":[{"t":"Alt + =","d":"AutoSum (Windows)"},{"t":"Cmd + Shift + T","d":"AutoSum on a Mac"},{"t":"SUM","d":"adds up a range of cells"}],"use":"Quick totals when building financial statements, like summing operating expenses.","example":"Five expense numbers sit in cells B2 to B6.\nClick B7 and press Alt + =\nExcel writes =SUM(B2:B6); press Enter.","tip":"Always check the range Excel guessed before pressing Enter: it can stop at a blank row.","like":"The \"add these up\" button."},{"plain":"Typing a number inside a formula (like ×1.05 for 5% growth) hides an assumption. If the assumption changes, you have to find and fix every formula by hand.","terms":[{"t":"Hard-code","d":"a typed number inside a formula"},{"t":"Input cell","d":"a separate cell holding the assumption"},{"t":"Assumption","d":"a number the model is built on"}],"use":"Good models keep every assumption in its own clearly labelled input cell, so changing it updates the whole model at once.","example":"Bad: revenue next year =B5*1.05 (the 5% is buried)\nGood: put 5% in an input cell called \"Growth\", then =B5*(1+Growth)\nNow changing growth to 7% updates every year instantly.","tip":"Rule of thumb: one assumption, one cell.","like":"Typing \"×1.05\" inside a formula is like hiding a note in a drawer: when the number changes, nobody knows where to find it."},{"plain":"Picks one item from a list, based on a number you give it. Perfect for flipping a whole model between scenarios with one switch.","terms":[{"t":"CHOOSE(number, option1, option2, option3)","d":"number = which option to return (1 = first, 2 = second…); options = the values to choose between"},{"t":"Scenario switch","d":"one cell that controls which case the model uses"}],"use":"Building base, upside and downside cases that you can switch between in one click.","example":"Cell B1 is your scenario switch: 1 = base, 2 = upside, 3 = downside.\nGrowth cell: =CHOOSE(B1, 5%, 8%, 2%)\nSet B1 to 2 → growth becomes 8%, and every formula using it updates.","tip":"Point every scenario-driven input at the same switch cell, so the whole model changes together.","like":"A switch with three settings (normal, best case, worst case): flip it and the whole model changes."}],"fmva-3s":[{"plain":"Build a model in this order: write down your assumptions, forecast the income statement, then the balance sheet, then the cash flow statement, and finally link them so the balance sheet balances.","terms":[{"t":"Assumptions","d":"inputs like growth, margins, collection days, CapEx"},{"t":"Supporting schedules","d":"side calculations for PP&E, debt and working capital"},{"t":"Balance","d":"assets = liabilities + equity"}],"use":"This is the standard workflow taught in FMVA for building a 3-statement model from scratch.","example":"1. Inputs: 5% growth, 40% gross margin, 45 days to collect\n2. Income statement: revenue, costs, net income\n3. Balance sheet: receivables, PP&E, debt… (cash left for later)\n4. Cash flow statement: from net income to ending cash\n5. Ending cash → balance sheet cash → check it balances","tip":"Cash on the balance sheet should come from the cash flow statement. Never type in a number to force it to balance.","like":"Like baking a layered cake: first the recipe (assumptions), then the bottom layer (income statement), the middle (balance sheet), the top (cash flow), and finally check it stands straight (it balances)."},{"plain":"Net income links to two places: it's the first line of the cash flow statement, and it's added to retained earnings on the balance sheet.","terms":[{"t":"Net income","d":"final profit from the income statement"},{"t":"CFO","d":"cash flow from operations, the first section of the cash flow statement"},{"t":"Retained earnings","d":"profits kept in the company, part of equity"}],"use":"These are the two core links between the three statements; if either is missing, the model won't balance.","example":"The income statement shows net income of $20.\nCash flow statement: first line = $20\nBalance sheet: retained earnings $100 + $20 − $5 dividends = $115","tip":"If your balance sheet is out by exactly the net income amount, one of these links is missing.","like":"Your profit goes two places: it's where you start when working out your cash, and it gets added to your savings jar (retained earnings)."},{"plain":"Depreciation reduced profit on the income statement, but no cash actually left the company that year, so the cash flow statement adds it back.","terms":[{"t":"Non-cash expense","d":"an expense with no cash payment"},{"t":"Indirect method","d":"building cash flow by starting from net income and adjusting it"},{"t":"CapEx","d":"the cash spent when the asset was bought"}],"use":"This add-back is the first adjustment in cash from operations in every model.","example":"Net income is $20, after a $10 depreciation charge.\nCash from operations starts at 20 + 10 = $30 (before working capital)\nThe real cash left the company years ago, when the machine was bought (CapEx).","tip":"The cash outflow is CapEx, not depreciation.","like":"You counted $10 of \"truck wear and tear\" as a cost this year, but you didn't actually pay anyone $10. To see your real cash, add it back."},{"plain":"When receivables go up, you've recorded sales that customers haven't paid for yet, so you have less cash than your profit suggests.","terms":[{"t":"Accounts receivable","d":"money customers owe you"},{"t":"Working capital adjustment","d":"the line on the cash flow statement converting profit into cash"},{"t":"Asset","d":"AR is a current asset"}],"use":"A key line in cash from operations in your model.","example":"Receivables were $50 last year and $70 this year.\n$20 more of your sales is still unpaid.\nCash flow statement: −$20 in cash from operations","tip":"Rule: asset up = cash down; asset down = cash up.","like":"Customers bought more on credit this year. You counted the sales, but the cash is still in their pockets, so your cash is lower than your profit."},{"plain":"When payables go up, you've received goods but haven't paid yet, so you're holding on to more cash.","terms":[{"t":"Accounts payable","d":"money you owe suppliers"},{"t":"Liability","d":"AP is a current liability"},{"t":"Working capital adjustment","d":"the line converting profit into cash"}],"use":"A key line in cash from operations in your model.","example":"Payables were $30 last year and $40 this year.\nYou owe suppliers $10 more but haven't paid it yet.\nCash flow statement: +$10 in cash from operations","tip":"Rule: liability up = cash up; liability down = cash down.","like":"You owe suppliers more than last year: you have their goods but haven't paid yet, so the cash is still in your pocket."},{"plain":"Money spent on long-term assets (machines, buildings, equipment) goes in the investing section, as cash going out.","terms":[{"t":"CapEx","d":"capital expenditures, spending on long-term assets"},{"t":"CFI","d":"cash flow from investing"},{"t":"PP&E","d":"property, plant and equipment on the balance sheet"}],"use":"CapEx links to the PP&E schedule and is a key part of free cash flow in a DCF.","example":"A factory buys a $25 machine.\nCash flow statement: −$25 in investing\nBalance sheet: PP&E +$25\nIncome statement: nothing today; depreciation spreads it over future years","tip":"CapEx never appears directly on the income statement.","like":"Buying a new oven for the bakery is a big long-term purchase, so it goes in the \"investing\" bucket, not everyday running costs."},{"plain":"The PP&E balance each year = last year's balance + new purchases (CapEx) − depreciation.","terms":[{"t":"PP&E","d":"property, plant and equipment (long-term physical assets)"},{"t":"CapEx","d":"new asset purchases this year"},{"t":"Depreciation","d":"the value used up this year"}],"use":"This schedule feeds three statements: PP&E on the balance sheet, depreciation on the income statement, and CapEx on the cash flow statement.","example":"A company starts the year with $200 of equipment.\nIt buys new machines: +$30\nThis year's depreciation: −$20\nYear-end PP&E = 200 + 30 − 20 = $210","tip":"Selling or writing off assets would also reduce PP&E.","like":"The value of your equipment: what you had, plus new things you bought, minus this year's wear and tear."},{"plain":"The debt balance each year = last year's debt + new borrowing − repayments.","terms":[{"t":"Issuance","d":"new borrowing this year"},{"t":"Repayment","d":"paying back part of the loan (principal)"},{"t":"Interest","d":"the cost of borrowing, calculated on the balance"}],"use":"The debt schedule feeds debt on the balance sheet, borrowing/repayment in financing cash flows, and interest on the income statement.","example":"A company owes $300 at the start of the year.\nIt borrows another $50\nIt repays $80\nYear-end debt = 300 + 50 − 80 = $270","tip":"Interest is often calculated on the AVERAGE balance, which creates a circular reference.","like":"Your loan balance: what you owed, plus anything new you borrowed, minus what you paid back."},{"plain":"The last line of the cash flow statement (ending cash) becomes the cash line on the balance sheet.","terms":[{"t":"Beginning cash","d":"cash at the start of the year (last year's ending cash)"},{"t":"Net change in cash","d":"operating + investing + financing"},{"t":"Ending cash","d":"beginning cash + net change"}],"use":"This is the final link that makes the whole model balance.","example":"Beginning cash: $100\nNet change this year: +$15\nEnding cash: $115\nBalance sheet cash = $115","tip":"Never type a number into balance sheet cash; it must link from the cash flow statement.","like":"The final balance on your bank statement must match the cash on your personal balance sheet."},{"plain":"A row at the bottom of your balance sheet that calculates assets minus (liabilities + equity). It should always be zero.","terms":[{"t":"Balance check","d":"assets − (liabilities + equity)"},{"t":"Conditional formatting","d":"making the cell turn red if it's not zero"}],"use":"It instantly tells you if something in your model is broken. Every professional model has one.","example":"Total assets $1,000; liabilities $600; equity $400.\nCheck = 1,000 − (600 + 400) = 0 ✓\nIf it showed 15, something worth 15 is missing or has the wrong sign.","tip":"Tiny rounding differences (like 0.001) are fine; anything bigger is an error.","like":"A simple \"do my books add up?\" test: what you own, minus what you owe, minus your own money, should be zero."},{"plain":"The two main ways to forecast revenue: apply a growth rate to last year's revenue, or build it from price × volume.","terms":[{"t":"Growth rate","d":"% change each year"},{"t":"Price × volume","d":"units sold × price per unit"},{"t":"Driver","d":"an underlying number that causes revenue"}],"use":"Revenue is the most important assumption in any model, because almost everything else flows from it.","example":"Simple: last year $250,000 × (1 + 5%) = $262,500\nDriver-based: 10,000 units × $25 = $250,000 this year\nNext year: 10,500 units (+5%) × $25.50 (+2%) = $267,750","tip":"Driver-based forecasts are easier to defend in an interview or exam than a single growth %.","like":"Two ways to guess next year's lemonade sales: \"about 5% more than this year\", or \"500 cups × $3 a cup\"."},{"plain":"Assume customers keep taking the same number of days to pay (DSO), then size receivables from revenue.","terms":[{"t":"DSO","d":"days sales outstanding, the average days customers take to pay"},{"t":"Formula","d":"Accounts receivable = Revenue × DSO ÷ 365"}],"use":"This is how receivables are forecast in the working capital schedule of almost every model.","example":"Next year's revenue is forecast at $365, and customers take 45 days to pay.\nAR = 365 × 45 ÷ 365 = $45\n(Roughly: 45 days' worth of sales is still unpaid at year end.)","tip":"Keep DSO near its historical level unless you have a reason to change it.","like":"If customers usually pay 45 days late, at year end you'll have about 45 days of sales still unpaid."},{"plain":"Assume products keep sitting in the warehouse for the same number of days (DIO), then size inventory from COGS.","terms":[{"t":"DIO","d":"days inventory outstanding, average days before stock is sold"},{"t":"COGS","d":"cost of goods sold"},{"t":"Formula","d":"Inventory = COGS × DIO ÷ 365"}],"use":"This is how inventory is forecast in the working capital schedule.","example":"Next year's COGS is $240, and stock sits 60 days.\nInventory = 240 × 60 ÷ 365 ≈ $39","tip":"Use COGS, not revenue, because inventory is recorded at cost.","like":"If stock usually sits on the shelf for 60 days, you'll be holding about 60 days' worth of stock at year end."},{"plain":"Assume you keep paying suppliers after the same number of days (DPO), then size payables from COGS.","terms":[{"t":"DPO","d":"days payable outstanding, average days before you pay suppliers"},{"t":"COGS","d":"cost of goods sold"},{"t":"Formula","d":"Accounts payable = COGS × DPO ÷ 365"}],"use":"This is how payables are forecast in the working capital schedule.","example":"Next year's COGS is $240, and you pay suppliers after 45 days.\nAP = 240 × 45 ÷ 365 ≈ $30","tip":"Some models use total purchases instead of COGS; follow the method in your course.","like":"If you usually pay suppliers after 45 days, you'll owe about 45 days of purchases at year end."},{"plain":"Side calculations on their own tabs that work out the detailed numbers, which are then fed into the three main statements.","terms":[{"t":"Working capital schedule","d":"receivables, inventory, payables"},{"t":"PP&E schedule","d":"CapEx and depreciation"},{"t":"Debt schedule","d":"borrowing, repayments and interest"},{"t":"Equity schedule","d":"share issues, buybacks, dividends"}],"use":"Keeps the main statements clean and makes it easy to trace where each number comes from.","example":"The PP&E schedule calculates:\ndepreciation → sent to the income statement\nCapEx → sent to the cash flow statement\nclosing PP&E → sent to the balance sheet","tip":"Most schedules follow the same pattern: opening + additions − reductions = closing.","like":"Side notes on scrap paper (your equipment list, loan details, stock levels) that feed the final numbers into the main statements."},{"plain":"When net working capital grows, more of the company's money is stuck in unpaid receivables and unsold stock, so less is available as cash.","terms":[{"t":"Net working capital (NWC)","d":"operating current assets (AR, inventory) − operating current liabilities (AP)"},{"t":"Free cash flow","d":"cash left after running and investing in the business"}],"use":"In a DCF, the increase in NWC is subtracted when calculating free cash flow.","example":"Net working capital rises from $80 to $95.\n$15 more is tied up in the business.\nFree cash flow is $15 lower.","tip":"Growing companies usually need more working capital each year, which uses cash.","like":"More of your money is sitting in unsold stock and unpaid customer bills, so there's less in the bank."},{"plain":"Dividends are cash paid to shareholders. They're a financing outflow on the cash flow statement, and they reduce retained earnings on the balance sheet.","terms":[{"t":"Dividends","d":"profits paid out to shareholders"},{"t":"Financing activities","d":"cash to and from lenders and shareholders"},{"t":"Retained earnings","d":"profits kept in the company"}],"use":"They appear in both the cash flow statement and the equity (retained earnings) schedule of your model.","example":"A company pays $5 of dividends.\nCash flow statement: −$5 in financing\nBalance sheet: retained earnings −$5\nIncome statement: no effect","tip":"Dividends are NOT an expense on the income statement.","like":"The owners take some profit home. Cash leaves the business and the savings jar (retained earnings) gets smaller."},{"plain":"The usual reasons a balance sheet doesn't balance, and how to hunt them down.","terms":[{"t":"Sign error","d":"a plus where there should be a minus (common in working capital)"},{"t":"Missing link","d":"a balance sheet item that changes with no matching line in the cash flow statement"},{"t":"Hard-coded cash","d":"typing a cash number instead of linking it"}],"use":"A debugging checklist you'll use on every model you build.","example":"Off by twice some number? Probably a flipped sign.\nOff by exactly net income? Retained earnings or the cash flow link is missing.\nBalances in year 1 but not year 2? Check year 2's new links.","tip":"Go year by year and find the FIRST year it breaks; the mistake is almost always there.","like":"Like a bank statement that doesn't match your records: usually a typo, a minus that should be a plus, or one thing you forgot to record."}],"fmva-val":[{"plain":"There are three main ways to value a company: from its own future cash flows (DCF), from what similar listed companies are worth (comps), or from what buyers paid for similar companies (precedents).","terms":[{"t":"DCF","d":"discounted cash flow, values the company on its own cash flows (intrinsic)"},{"t":"Comps","d":"comparable companies, uses peers' valuation multiples (relative)"},{"t":"Precedents","d":"precedent transactions, uses multiples from past acquisitions (relative)"}],"use":"Bankers usually show all three side by side on a football field chart to agree a value range.","example":"Valuing a company with all three:\nDCF says $45–55 a share\nComps say $40–50\nPrecedents say $50–60\nThe overlap ($50–55) guides the final range.","tip":"Precedents usually come out highest because buyers pay extra (a control premium) to take over a company.","like":"Pricing a house three ways: the rent it will earn over time (DCF), what similar houses on the street are listed at (comps), and what similar houses actually sold for (precedents)."},{"plain":"The cash the business produces after paying taxes and reinvesting in itself, available to everyone who funded it: lenders and shareholders.","terms":[{"t":"EBIT × (1 − t)","d":"operating profit after tax (called NOPAT)"},{"t":"D&A","d":"depreciation and amortization, added back because it's not cash"},{"t":"CapEx","d":"spending on equipment"},{"t":"Increase in NWC","d":"extra cash tied up in working capital"}],"use":"This is the cash flow you forecast and discount at WACC in a DCF to get enterprise value.","example":"EBIT $100, tax rate 25% → after-tax profit $75\n+ D&A $20 (not cash)\n− CapEx $30\n− Increase in working capital $5\nFCFF = 75 + 20 − 30 − 5 = $60","tip":"\"Unlevered\" means BEFORE interest, so don't subtract interest here.","like":"The cash a business makes after taxes and after buying the equipment it needs: the money that could go to both the bank and the owners."},{"plain":"The cash left just for shareholders, after paying lenders their interest and adding any new borrowing.","terms":[{"t":"FCFF","d":"unlevered free cash flow"},{"t":"Interest × (1 − t)","d":"interest paid, after its tax saving"},{"t":"Net borrowing","d":"new debt taken on minus debt repaid"}],"use":"Discounted at the cost of equity, it gives equity value directly.","example":"Unlevered free cash flow is $60. Interest is $10, tax rate 25%. The company borrows $5 more.\nAfter-tax interest = 10 × 0.75 = 7.5\nFCFE = 60 − 7.5 + 5 = $57.5","tip":"\"Levered\" means AFTER paying the debt holders.","like":"What's left for the owners after the bank gets its interest, plus any new loans that came in."},{"plain":"Unlevered free cash flow belongs to everyone who funded the company (lenders and shareholders), so you discount it at their blended required return: WACC.","terms":[{"t":"WACC","d":"weighted average cost of capital, the blended return lenders and shareholders require"},{"t":"Unlevered FCF","d":"cash flow before any payments to lenders"},{"t":"Enterprise value","d":"the value of the whole business"}],"use":"This is the standard DCF in FMVA: forecast FCFF, discount at WACC, get enterprise value.","example":"FCFF of $60 a year, discounted at an 8% WACC\n→ gives enterprise value (the whole business)\nThen subtract net debt to get the shareholders' share.","tip":"The matching set to remember: unlevered FCF ↔ WACC ↔ enterprise value.","like":"This cash belongs to both the bank and the owners, so you value it using the average return they both expect."},{"plain":"Levered free cash flow belongs only to shareholders (lenders are already paid), so you discount it at the return shareholders require: the cost of equity.","terms":[{"t":"Cost of equity (Re)","d":"the return shareholders expect, usually from CAPM"},{"t":"Levered FCF","d":"cash left for shareholders after debt payments"},{"t":"Equity value","d":"the value belonging to shareholders"}],"use":"An alternative DCF that goes straight to equity value.","example":"FCFE of $57.5 a year, discounted at an 11% cost of equity\n→ gives equity value directly (no need to subtract debt)","tip":"Using WACC on levered FCF (or the cost of equity on unlevered FCF) is a classic exam trap.","like":"This cash belongs only to the owners, so you value it using only what owners expect to earn."},{"plain":"Assume that after your forecast ends, cash flows keep growing at a small, steady rate forever. This formula gives the value of all those future years at the end of the forecast.","terms":[{"t":"FCFₙ","d":"free cash flow in the last forecast year"},{"t":"g","d":"long-term growth rate (small, e.g. 2%)"},{"t":"WACC","d":"discount rate"},{"t":"Terminal value","d":"the value of all cash flows after the forecast"}],"use":"Every DCF needs a terminal value, because you can't forecast year by year forever.","example":"Year-5 free cash flow is $100. Growth forever 2%; WACC 8%.\nNext year's cash flow: 100 × 1.02 = 102\nTerminal value = 102 ÷ (0.08 − 0.02) = $1,700\nThat's its value at year 5, so discount it back 5 years to today.","tip":"The terminal value is at the END of the forecast, so you must still discount it to today.","like":"You can't forecast a business year by year forever. So after year 5 you assume it keeps growing slowly, like a grown tree that still adds a thin ring each year."},{"plain":"Assume the company is sold at the end of your forecast for a typical market multiple, like 8 times EBITDA.","terms":[{"t":"Exit multiple","d":"e.g. EV/EBITDA, usually taken from comparable companies"},{"t":"Final-year EBITDA","d":"EBITDA in the last forecast year"},{"t":"Terminal value","d":"value of the business at the end of the forecast"}],"use":"A market-based alternative to the perpetuity growth method. Bankers often use both and compare.","example":"Year-5 EBITDA is forecast at $150. Similar companies trade at 8x EBITDA.\nTerminal value = 150 × 8 = $1,200\nThen discount it back 5 years to today.","tip":"Sanity check: work out what growth rate that multiple implies; if it's unrealistic, the multiple is too high.","like":"Assume you sell the business in year 5 at the going rate, say 8 times its yearly profit, like similar businesses sell for."},{"plain":"The value of the whole business to everyone who funded it. Think of it as the price to buy the entire company: you pay for the shares, take on its debts, but get its cash.","terms":[{"t":"Market cap","d":"share price × number of shares"},{"t":"Debt","d":"loans and bonds"},{"t":"Preferred stock","d":"a type of share paid before common shares"},{"t":"Minority interest","d":"the part of subsidiaries owned by outsiders"},{"t":"Cash","d":"subtracted because the buyer gets it"}],"use":"EV is the top of valuation multiples like EV/EBITDA, and it's what a DCF with WACC calculates.","example":"A company's shares are worth $800 in total. It has $300 of debt and $100 of cash.\nEV = 800 + 300 − 100 = $1,000\n(A buyer pays $800 for shares, takes on $300 of debt, but gets $100 of cash.)","tip":"Cash is SUBTRACTED, debt is ADDED. Mixing them up is a common mistake.","like":"Buying a house that still has a mortgage: you pay the seller for their share, you take over the mortgage, but you keep any cash left in the house's safe. That total is enterprise value."},{"plain":"To find what shareholders own, start with enterprise value and take away everything that belongs to others first: lenders, preferred shareholders and minority owners.","terms":[{"t":"Net debt","d":"debt minus cash"},{"t":"Preferred stock","d":"paid before common shareholders"},{"t":"Minority interest","d":"outsiders' share of subsidiaries"},{"t":"Equity value","d":"what common shareholders own"}],"use":"The final step in a DCF before working out the share price.","example":"A DCF gives an enterprise value of $1,000. Debt is $300 and cash is $100.\nNet debt = 300 − 100 = $200\nEquity value = 1,000 − 200 = $800","tip":"It's just the enterprise value formula worked backwards.","like":"The house is worth $1,000k. Subtract the mortgage left after using the cash in the safe ($200k) and $800k is what the owner really has."},{"plain":"Divide what the shareholders own (equity value) by the number of shares, including shares that could be created from options.","terms":[{"t":"Equity value","d":"the value belonging to common shareholders"},{"t":"Diluted shares","d":"existing shares + extra shares from in-the-money options and convertibles"},{"t":"Treasury stock method","d":"how the extra shares are calculated"}],"use":"The final output of a DCF. Compare it with today's share price to see if the stock looks cheap or expensive.","example":"Equity value is $800m. There are 38m shares plus 2m extra from options = 40m diluted shares.\nImplied share price = 800 ÷ 40 = $20.00\nIf the stock trades at $16, it looks undervalued.","tip":"Use DILUTED shares, not basic, or your share price will be too high.","like":"A pizza place's owners' share is worth $800 and it's split into 40 shares. Each share is worth $20."},{"plain":"Cash comes in throughout the year, not all on December 31, so you discount each year's cash flow as if it arrived in the middle of the year.","terms":[{"t":"Discount period","d":"how many years away a cash flow is"},{"t":"Mid-year","d":"use t − 0.5 instead of t (0.5, 1.5, 2.5…)"},{"t":"End-of-year","d":"use t (1, 2, 3…)"}],"use":"Makes a DCF slightly more realistic; it raises the valuation a little because cash arrives sooner.","example":"Year 1 cash flow is $100; discount rate 10%.\nEnd-of-year: 100 ÷ 1.10¹ = $90.9\nMid-year: 100 ÷ 1.10^0.5 = $95.3\nMid-year gives about 5% more value.","tip":"A terminal value from an exit multiple is usually still discounted a full n years.","like":"Your salary arrives every month, not all on 31 December. So on average, a year's pay arrives in the middle of the year."},{"plain":"In most DCFs, the majority of the value (often 60–80%) comes from the terminal value: the years after your forecast.","terms":[{"t":"Terminal value","d":"value of all cash flows after the forecast period"},{"t":"Forecast period","d":"the years you model in detail (often 5)"},{"t":"PV","d":"present value, value today"}],"use":"It's why sensitivity tables on WACC and long-term growth matter so much: small changes move the answer a lot.","example":"Present value of years 1–5 cash flows: $300\nPresent value of the terminal value: $700\nEnterprise value = $1,000, and 70% of it comes from the terminal value.","tip":"If the terminal value is above about 85% of the total, your forecast may be too short or your growth too aggressive.","like":"Most of a business's value comes from the years after the first five, just like most of a young tree's wood is still to grow."},{"plain":"How many dollars investors pay for each $1 of the company's yearly profit.","terms":[{"t":"P/E","d":"price-to-earnings ratio"},{"t":"Share price","d":"current market price"},{"t":"EPS","d":"earnings per share"}],"use":"The most widely quoted valuation multiple; a quick check of whether a stock looks cheap or expensive versus peers.","example":"A stock costs $30 and earns $2 per share a year.\nP/E = 30 ÷ 2 = 15x\nInvestors pay $15 for every $1 of annual profit.","tip":"P/E pairs EQUITY value (price) with profit AFTER interest (EPS), which is consistent.","like":"A share costs $30 and the company earns $2 a share each year. You're paying 15 years' worth of its profit."},{"plain":"EV multiples (like EV/EBITDA) let you compare companies' businesses fairly, even if one has a lot of debt and another has none.","terms":[{"t":"EV multiple","d":"enterprise value ÷ a metric like EBITDA"},{"t":"Equity multiple","d":"share price ÷ a metric like EPS"},{"t":"Capital structure","d":"the mix of debt and equity"}],"use":"In comparable company analysis, EV/EBITDA is usually preferred when peers have very different debt levels.","example":"Two identical businesses each earn $100 of EBITDA. One has no debt; the other has lots.\nEV/EBITDA: similar for both, because EV includes debt\nP/E: very different, because the indebted one pays lots of interest","tip":"Prefer EV/EBITDA when comparing companies with different amounts of debt.","like":"Comparing two houses on the rent they bring in, not on how big each owner's mortgage is. It keeps the comparison fair."},{"plain":"The top and bottom of a multiple must belong to the same group of investors. Enterprise value (everyone) goes with profits before interest; equity value (shareholders only) goes with profits after interest.","terms":[{"t":"Pre-interest metrics","d":"revenue, EBITDA, EBIT (shared by lenders and shareholders)"},{"t":"Post-interest metrics","d":"net income, EPS (shareholders only)"},{"t":"EV vs equity value","d":"whole business vs shareholders' part"}],"use":"Avoids building meaningless multiples in your comps table.","example":"Correct: EV/EBITDA, EV/Revenue, Price/EPS (P/E)\nWrong: EV/Net income (interest already removed from the bottom but debt still in the top)\nWrong: Price/EBITDA","tip":"Quick test: if interest hasn't been paid yet in the bottom number, the top must be EV.","like":"Compare apples with apples: if the top number includes the bank's share, the bottom number must be profit before the bank gets paid."},{"plain":"Find listed companies similar to yours, see how the market values them (their multiples), and apply those multiples to your company.","terms":[{"t":"Peer group","d":"similar companies by industry, size, growth"},{"t":"Trading multiples","d":"multiples based on current share prices, e.g. EV/EBITDA, P/E"},{"t":"Median","d":"the middle value, less affected by outliers"}],"use":"One of the fastest and most widely used valuation methods in banking and equity research.","example":"Five similar companies trade at 9x–11x EBITDA; the median is 10x.\nYour company's EBITDA is $50.\nImplied EV = 50 × 10 = $500 (range 450–550)","tip":"Use the median rather than the average, so one strange company doesn't skew the result.","like":"Pricing your house by checking what similar houses on your street are listed at."},{"plain":"Look at what buyers actually paid when similar companies were acquired, and apply those deal multiples to your company.","terms":[{"t":"Precedent transaction","d":"a past acquisition of a similar company"},{"t":"Transaction multiple","d":"deal price (EV) ÷ the target's metric, e.g. EBITDA"},{"t":"Control premium","d":"the extra a buyer pays to take control"}],"use":"Used in M&A to estimate what a buyer might pay, and in fairness opinions.","example":"Similar companies were bought at 11x–13x EBITDA.\nYour company's EBITDA is $50.\nImplied EV = $550–650\nHigher than comps (9x–11x) because buyers paid a control premium.","tip":"Old deals may reflect very different market conditions, so recent deals carry more weight.","like":"Pricing your house by checking what similar houses actually sold for. Buyers often paid extra to win."},{"plain":"A horizontal bar chart that shows the value range from each valuation method stacked on top of each other, so you can see where they overlap.","terms":[{"t":"Range bar","d":"one bar per method, from its low to its high value"},{"t":"Football field","d":"named because it looks like yard lines on a field"},{"t":"Overlap","d":"the area where most methods agree"}],"use":"The standard summary page in bankers' pitchbooks and fairness opinions.","example":"One bar each for: 52-week trading range ($38–52), comps ($40–50), precedents ($50–60), DCF ($45–55).\nAll drawn against the same share-price axis.\nThe overlap around $48–53 suggests a recommended range.","tip":"It's a bar chart of value RANGES, not a waterfall and not a line chart.","like":"Several price estimates for the same house, drawn as bars on top of each other, so you can see where they overlap."},{"plain":"A grid that shows how your valuation changes when you change two key assumptions at the same time.","terms":[{"t":"WACC","d":"the discount rate, usually across the top"},{"t":"Terminal growth (g)","d":"long-term growth, usually down the side"},{"t":"Each cell","d":"the share price (or EV) for that combination"}],"use":"Shows how sensitive the answer is to assumptions, which is critical because the terminal value drives most of a DCF.","example":"WACC 7%, 8%, 9% across the top; growth 1.5%, 2.0%, 2.5% down the side.\nThe middle cell (8%, 2.0%) is the base case: $20.0\nLow WACC + high growth corner: $25.9; high WACC + low growth: $16.6","tip":"Built with Excel's Data Table tool.","like":"A \"what if?\" grid: what's my house worth if interest rates are 7%, 8% or 9%, and if prices grow 1.5%, 2% or 2.5%?"},{"plain":"The long-term growth rate in a DCF should be modest, no higher than the economy's long-run growth, because no company can outgrow the whole economy forever.","terms":[{"t":"Terminal growth (g)","d":"growth assumed forever after the forecast"},{"t":"GDP growth","d":"long-run growth of the economy"},{"t":"Inflation","d":"around 2% in many countries"}],"use":"Keeps the terminal value, and therefore the whole DCF, realistic.","example":"g = 2.5% → reasonable\ng = 8% forever → unrealistic: the company would eventually be bigger than the economy","tip":"g must always be below WACC, or the formula gives nonsense (negative or infinite value).","like":"No tree grows 10% a year forever. In the long run, a company can't grow faster than the whole economy."},{"plain":"Options that are worth using (in-the-money) would create new shares. But the cash paid to use them is assumed to buy back some shares, so only the difference counts as extra shares.","terms":[{"t":"In-the-money","d":"the option's strike price is below the current share price"},{"t":"Strike price","d":"the price the holder pays per share"},{"t":"Proceeds","d":"number of options × strike price"},{"t":"Diluted shares","d":"basic shares + net new shares"}],"use":"Used to calculate diluted shares for market cap and the implied share price.","example":"10m options with a $10 strike; the share price is $20.\nHolders pay 10m × $10 = $100m\nThe company uses $100m to buy back shares at $20 = 5m shares\nNet new shares = 10m − 5m = 5m","tip":"Options with a strike above the share price (out-of-the-money) are ignored.","like":"Employees can buy 10 shares at $10 each. The company takes their $100 and buys back 5 shares at $20, so only 5 new shares really exist."},{"plain":"Intrinsic valuation asks \"what are this company's own future cash flows worth?\" Relative valuation asks \"what are similar companies worth?\"","terms":[{"t":"Intrinsic","d":"based on the company's own cash flows, i.e. DCF"},{"t":"Relative","d":"based on peers' multiples, i.e. comps and precedents"}],"use":"Using both gives a balanced view. If they disagree a lot, you dig into why.","example":"DCF says $50 a share; peers' multiples imply $42.\nMaybe your growth assumptions are too optimistic, or the market is pessimistic about the sector.","tip":"Relative valuation can mislead if the whole market is overvalued, because the peers are too.","like":"Intrinsic: \"what's this house worth based on the rent it brings in?\" Relative: \"what are similar houses worth?\""}],"fmva-bud":[{"plain":"Start big with the size of the whole market, then estimate what share of it you'll win.","terms":[{"t":"TAM","d":"total addressable market, the whole market's size"},{"t":"Market share","d":"the % of the market you expect to win"}],"use":"Quick estimates for startups and new markets, and a sanity check against bottom-up forecasts.","example":"The European e-bike market is worth $10bn a year.\nYou think you can win 2% of it.\nRevenue = 10bn × 2% = $200m","tip":"It's easy to be too optimistic about market share; check it against what competitors achieve.","like":"\"There are a million coffee drinkers in this city. If I win 2% of them, that's my customer base.\""},{"plain":"Build revenue from the ground up using the real drivers of the business, like number of stores, customers and average spend.","terms":[{"t":"Drivers","d":"the operating numbers behind revenue: units, stores, customers, price, capacity"},{"t":"Bottom-up","d":"starting from the smallest pieces and adding up"}],"use":"Gives more detailed, easier-to-defend forecasts, and is the approach most FP&A teams use.","example":"A café chain has 50 stores.\nEach serves 12,000 customers a year.\nAverage spend is $25.\nRevenue = 50 × 12,000 × $25 = $15m","tip":"Compare it with a top-down estimate: if the two are far apart, one of them is wrong.","like":"\"I have 50 shops, each serves 12,000 people a year, and each spends $25.\" Multiply it out."},{"plain":"Every budget line starts at zero each year and has to be justified from scratch, instead of starting from last year's numbers.","terms":[{"t":"Zero-based budgeting (ZBB)","d":"build each cost from zero"},{"t":"Incremental budgeting","d":"last year's budget plus or minus a bit"}],"use":"Used when companies want to cut costs and challenge habits like \"we always spend this much\".","example":"The marketing team can't just ask for \"last year + 5%\".\nEvery campaign must be explained: what it costs and what it will bring in.\nAnything that can't be justified gets cut.","tip":"More work than incremental budgeting, but it finds waste.","like":"Planning your monthly budget from zero: every subscription has to earn its place instead of just rolling over from last month."},{"plain":"Take last year's budget and adjust it up or down by a small amount.","terms":[{"t":"Incremental budgeting","d":"last year's budget as the starting point"},{"t":"Base","d":"the previous period's numbers"}],"use":"Quick and simple; common in stable businesses where little changes year to year.","example":"Last year's travel budget was $1m.\nInflation is 3%.\nThis year's travel budget = $1m × 1.03 = $1.03m","tip":"It can lock in past waste, because nobody questions the starting number.","like":"\"Last year I spent $1,000 on travel, so this year I'll budget $1,030.\""},{"plain":"A forecast that always looks the same distance ahead. Each time a month or quarter ends, you drop it and add a new one at the end.","terms":[{"t":"Rolling forecast","d":"a forecast that keeps moving forward"},{"t":"Horizon","d":"how far ahead it looks, e.g. always 12 months"},{"t":"Static budget","d":"set once for the year and not updated"}],"use":"Keeps plans up to date, which is why many FP&A teams prefer it to a fixed annual budget.","example":"In March you forecast April → March next year (12 months).\nIn April you update it to cover May → April next year.\nIt always shows the next 12 months.","tip":"Different from an annual budget, which is set once and runs out at year end.","like":"Always planning the next 12 months: each month you drop the one that just ended and add a new one at the end."},{"plain":"Compare what actually happened with what you planned, and explain the reasons for any differences.","terms":[{"t":"Variance","d":"actual − budget"},{"t":"Favorable / unfavorable","d":"whether the difference helps or hurts profit"},{"t":"Price vs volume effect","d":"splitting a revenue variance into selling price and quantity"}],"use":"The core of FP&A reporting: managers want to know not just what happened, but why.","example":"Budgeted revenue $100; actual $92.\nVariance = −$8 (unfavorable)\nWhy? Sold fewer units (−$10) but at slightly higher prices (+$2).","tip":"Always explain the cause, not just the number.","like":"You budgeted $300 for groceries and spent $340. Variance analysis asks why: more shopping trips, or higher prices?"},{"plain":"A favorable variance helps profit; an unfavorable variance hurts profit, whether it's revenue or cost.","terms":[{"t":"Favorable (F)","d":"better for profit than budgeted"},{"t":"Unfavorable (U)","d":"worse for profit than budgeted"},{"t":"Variance","d":"actual − budget"}],"use":"Labeling variances correctly in management reports and exam questions.","example":"Costs: budget $50, actual $45 → $5 favorable (spent less)\nRevenue: budget $100, actual $92 → $8 unfavorable (earned less)","tip":"A HIGHER cost is unfavorable even though the number is bigger. Think \"good or bad for profit?\", not \"higher or lower?\".","like":"Spending less than planned is good news (favorable). Earning less than planned is bad news (unfavorable)."},{"plain":"A scenario changes many inputs at once to tell a story (like \"recession\"). A sensitivity changes just one or two inputs to see how much they matter.","terms":[{"t":"Scenario analysis","d":"base, upside and downside cases, each with several inputs changed together"},{"t":"Sensitivity analysis","d":"testing one or two inputs over a range"}],"use":"Both show risk in a model. Scenarios usually use a CHOOSE switch; sensitivities use Data Tables.","example":"Downside scenario: revenue −10%, margin −2 points, CapEx +5%, all together.\nSensitivity: how the share price changes as WACC goes from 7% to 9%, everything else unchanged.","tip":"Many inputs at once = scenario. One or two at a time = sensitivity.","like":"Scenario: \"What if I lose my job?\" Income, spending and savings all change together. Sensitivity: \"What if just my rent goes up?\""},{"plain":"Fixed costs stay the same no matter how much you sell. Variable costs go up with every extra unit you sell.","terms":[{"t":"Fixed costs","d":"rent, salaries, insurance"},{"t":"Variable costs","d":"materials, shipping, sales commissions"},{"t":"Relevant range","d":"the volume range where fixed costs really stay fixed"}],"use":"The basis of break-even analysis and operating leverage, and important for forecasting costs in a model.","example":"A bakery pays $5,000 a month rent (fixed), whether it sells 100 or 10,000 loaves.\nEach loaf needs $1 of flour and packaging (variable).\n1,000 loaves = $1,000 of variable cost; 2,000 loaves = $2,000.","tip":"\"Fixed\" only holds within a range: grow enough and you'll need a bigger bakery.","like":"Your phone plan is fixed (the same every month). Your taxi spending is variable (the more you ride, the more you pay)."},{"plain":"What each sale leaves over after its own variable costs, which then goes toward paying fixed costs and, after that, profit.","terms":[{"t":"Contribution margin","d":"price − variable cost (per unit or in total)"},{"t":"Variable costs","d":"costs that rise with each unit"},{"t":"Contribution margin ratio","d":"contribution margin ÷ revenue"}],"use":"Used for pricing decisions and to calculate break-even.","example":"You sell a product for $10. Materials and shipping cost $4 per unit.\nContribution margin = 10 − 4 = $6 per unit\nRatio = 6 ÷ 10 = 60%","tip":"It's different from gross profit, which subtracts COGS (which can include some fixed costs).","like":"You sell a cupcake for $10 and its ingredients cost $4. Each cupcake chips in $6 toward rent and your profit."},{"plain":"The number of units you need to sell so that the money left over from each sale exactly covers your fixed costs: no profit, no loss.","terms":[{"t":"Fixed costs","d":"costs that don't change with volume"},{"t":"Contribution margin per unit","d":"price − variable cost per unit"},{"t":"Break-even","d":"where profit = 0"}],"use":"Used to judge risk and set targets: how many units before we start making money?","example":"Fixed costs are $30,000 a year. Each unit sells for $10 and costs $4 to make.\nContribution margin = $6 per unit\nBreak-even = 30,000 ÷ 6 = 5,000 units\nEvery unit after 5,000 adds $6 of profit.","tip":"Break-even in dollars = fixed costs ÷ contribution margin ratio (30,000 ÷ 60% = $50,000).","like":"Your stall costs $30,000 a year and each cupcake chips in $6. Sell 5,000 cupcakes and the stall is paid for; every cupcake after that is profit."},{"plain":"A chart that starts at one total, shows each increase and decrease as a floating bar, and ends at a new total.","terms":[{"t":"Waterfall (bridge) chart","d":"shows step-by-step changes between two numbers"},{"t":"Floating bar","d":"a bar that starts where the previous one ended"}],"use":"Explaining WHY a number changed, e.g. last year's profit to this year's, or budget to actual.","example":"Last year's EBITDA: $100\n+ $15 from selling more units\n− $5 from lower prices\n− $8 from higher costs\nThis year's EBITDA: $102","tip":"Great for variance analysis presentations to management.","like":"Explaining why your bank balance went from $100 to $102: +$15 from extra shifts, −$5 from lower tips, −$8 from higher bills."},{"plain":"A good dashboard shows only the numbers that matter for the decision, clearly and consistently, so readers get the message in seconds.","terms":[{"t":"KPI","d":"key performance indicator, a metric that tracks success"},{"t":"Clutter","d":"anything that doesn't help the decision"}],"use":"Presenting your model's results to managers, who often only look for a few seconds.","example":"One page: three tiles for revenue, margin and cash; one revenue trend line; one bar chart by region.\nSame colors for the same things everywhere.\nNo extra decoration.","tip":"Every chart should answer a question the reader actually has.","like":"Like your car's dashboard: just the few things you need at a glance (speed, fuel, warning lights), not the whole engine manual."},{"plain":"A slide presentation that investment bankers use to pitch their services to a client or present a deal idea.","terms":[{"t":"Pitchbook","d":"a bank's presentation to a client"},{"t":"Credentials","d":"the bank's past deals, shown to win trust"},{"t":"Football field","d":"the valuation summary chart often included"}],"use":"Junior bankers spend a lot of time building these; FMVA includes skills like presenting financial information and building pitchbook slides.","example":"Typical pages: the bank's credentials\nindustry overview\nvaluation summary (football field)\nrecommended strategy and next steps","tip":"Clean, consistent formatting matters as much as the numbers.","like":"A sales presentation a bank uses to win your business, like a wedding planner's portfolio."}]};

LIBRARY.forEach(L => { const arr = BUNDLED_EX[L.id] || []; L.text.trim().split('\n').forEach((l, i) => { const k = l.indexOf(' | '); if (arr[i]) BUNDLE_MAP.set(l.slice(0, k).trim() + '\u0001' + l.slice(k + 3).trim(), arr[i]); }); });

const hasExplain = c => !!getExplain(c);
const explainBtn = c => (hasExplain(c) || sampleFn) ? `<button class="btn explain" id="explain">💡 Explain this</button>` : '';
function explainPrompt(items) {
  return `You are a friendly finance tutor helping a student studying for CFI's FMVA (Financial Modeling & Valuation Analyst) certification. They review flashcards on their phone and tapped "Explain" because the card alone isn't enough.
For EACH item, return:
- "plain": what it means in plain everyday words (1–2 short sentences, no jargon left unexplained).
- "terms": every letter, symbol, abbreviation or technical term in the question and answer, each with a short meaning, e.g. {"t":"Re","d":"Cost of equity: the return shareholders expect"}. For a simple definition with no symbols, list the 1–3 key terms. Never empty if there's any jargon.
- "use": why it matters / when an analyst actually uses it in modeling or valuation (1–2 sentences).
- "example": a short concrete example. If it's a formula or ratio, a tiny worked example with simple numbers showing the arithmetic step by step (use \\n between lines). Otherwise a real-world-style example.
- "tip": one common mistake, exam trap or memory trick (1 sentence).
Keep each field short enough to read on a phone. Same language as the card. Use plain text, no markdown.
Reply with ONLY JSON: [{"i":0,"plain":"...","terms":[{"t":"...","d":"..."}],"use":"...","example":"...","tip":"..."}]

ITEMS:
${JSON.stringify(items)}`;
}
async function fetchExplain(entries) { // entries: [{c, d}]
  const items = entries.map(({ c, d }, i) => ({ i, topic: d ? d.name.replace(/^FMVA · /, '') : '', question: c.front, answer: c.back }));
  const prompt = explainPrompt(items);
  let res;
  try { res = await sampleFn.json(prompt, { modelTier: 'default' }); }
  catch (e) { if (e && (e.code === 'not_granted' || e.code === 'rate_limited')) throw e;
    const r = await sampleFn(prompt, { modelTier: 'default' }); const mm = (r.text || '').match(/\[[\s\S]*\]/); res = mm ? JSON.parse(mm[0]) : null; }
  if (res && !Array.isArray(res) && typeof res === 'object') res = Array.isArray(res.items) ? res.items : [Object.assign({ i: 0 }, res)];
  if (!Array.isArray(res)) throw new Error('bad');
  let got = 0;
  res.forEach(r => { const e = r && entries[r.i ?? 0]; if (!e || !(r.plain || r.use)) return;
    e.c.explain = { plain: String(r.plain || ''), terms: Array.isArray(r.terms) ? r.terms.filter(t => t && t.t).map(t => ({ t: String(t.t), d: String(t.d || '') })) : [],
      use: String(r.use || ''), example: String(r.example || ''), tip: String(r.tip || '') }; got++; });
  if (!got) throw new Error('bad');
  save(); return got;
}
function stepsHTML(t) {
  const lines = t.replace(/\\n/g, '\n').split('\n').map(l => l.trim()).filter(Boolean);
  const fmt = l => esc(l).replace(/(=[A-Z][A-Z.]*\([^)]*\)(?:\s*[\/*+\-]\s*[\w$().]+)?)/g, '<code>$1</code>');
  if (lines.length === 1) return `<p>${fmt(lines[0])}</p>`;
  return `<div class="setup">${fmt(lines[0])}</div>` + lines.slice(1).map((l, i) => `<div class="step"><span class="sn">${i + 1}</span><span>${fmt(l)}</span></div>`).join('');
}
function explainHTML(x, card) {
  let pic = '';
  try { const f = card && VIS[card.front]; if (f && BUNDLE_MAP.has(card.front + '\u0001' + card.back)) pic = f(); } catch (e) { pic = ''; }
  const sec = (h, body) => body ? `<div class="exsec"><div class="exh">${h}</div>${body}</div>` : '';
  const more = [
    whereHTML(card),
    sec('What each part means', x.terms && x.terms.length && x.terms.map(t => `<div class="term"><b>${esc(t.t)}</b><span>${esc(t.d)}</span></div>`).join('')),
    sec('When you’d use it', x.use && `<p>${esc(x.use)}</p>`),
  ].join('');
  return [
    x.like ? `<div class="exsec like"><div class="exh">💬 Think of it like this</div><p>${esc(x.like)}</p></div>` : '',
    sec(x.like ? 'In finance terms' : 'In plain words', x.plain && `<p>${esc(x.plain)}</p>`),
    pic ? `<div class="exsec" style="padding:12px 10px"><div class="exh" style="padding-left:4px">Picture it</div>${pic}</div>` : '',
    sec('Step-by-step example', x.example && stepsHTML(x.example)),
    sec('⚠️ Watch out', x.tip && `<p>${esc(x.tip)}</p>`),
    more ? `<details class="moredet"><summary>More detail: terms, where it’s used <span class="chev">▾</span></summary><div class="stack" style="margin-top:10px">${more}</div></details>` : '',
  ].join('');
}
function explainSheet(card) {
  const d = deckOf(card);
  modal(`<div class="row"><h2 style="flex:1">💡 Explained</h2><button class="icon-btn" data-close aria-label="Close">✕</button></div>
    <div class="stack"><div class="exhead"><div class="q">${esc(card.front)}</div><div class="a">${esc(card.back)}</div></div>
    <div id="exb" class="stack" style="margin-top:0"></div>
    ${sampleFn ? `<div id="fu" class="stack" style="margin-top:4px"><div class="row" style="gap:8px"><input id="fq" placeholder="Still confused? Ask a question…" enterkeyhint="send"><button class="btn primary" id="fa" style="width:auto;min-width:72px">Ask</button></div><div id="fo"></div></div>` : ''}
    <button class="btn" data-close>Got it</button></div>`, (m) => {
    const box = m.querySelector('#exb');
    const show = () => { box.innerHTML = explainHTML(getExplain(card), card); };
    const load = async () => {
      box.innerHTML = `<div class="loading"><span class="spin"></span>Writing an explanation…</div>`;
      try { await fetchExplain([{ c: card, d }]); if (document.body.contains(m)) show(); }
      catch (e) {
        box.innerHTML = `<div class="feedback no">${e && e.code === 'not_granted' ? 'Explanations weren’t allowed.' : e && e.code === 'rate_limited' ? 'Busy right now. Try again in a minute.' :
          'No connection right now. Open this again when you have signal, or download explanations for your decks before your ride (⋯ menu on the home screen).'}</div>
          ${e && e.code === 'not_granted' ? '' : '<button class="btn" id="retry" style="margin-top:10px">Try again</button>'}`;
        const r = box.querySelector('#retry'); if (r) r.onclick = load;
      }
    };
    if (hasExplain(card)) show(); else if (sampleFn) load(); else box.innerHTML = `<div class="feedback no">Explanations aren’t available here.</div>`;
    const fa = m.querySelector('#fa');
    if (fa) {
      const fq = m.querySelector('#fq'), fo = m.querySelector('#fo');
      const ask = async () => {
        const qn = fq.value.trim(); if (!qn) return fq.focus();
        fa.disabled = true; fo.innerHTML = `<div class="loading"><span class="spin"></span>Thinking…</div>`;
        try {
          const r = await sampleFn(`You are a friendly finance tutor for a student studying for CFI's FMVA certification, reading on a phone. They're on this flashcard:\nQuestion: ${card.front}\nAnswer: ${card.back}\n\nTheir question: ${qn}\n\nAnswer clearly and briefly (under 120 words), plain text, no markdown. Use a tiny numeric example if it helps.`,
            { modelTier: 'default', cache: false, onText: ({ text }) => { fo.innerHTML = `<div class="exsec"><div class="exh">You asked: ${esc(qn)}</div><p>${esc(text)}</p></div>`; } });
          fo.innerHTML = `<div class="exsec"><div class="exh">You asked: ${esc(qn)}</div><p>${esc(r.text)}</p></div>`; fq.value = '';
        } catch (e) { fo.innerHTML = `<div class="feedback no">${e && e.code === 'rate_limited' ? 'Busy right now. Try again in a minute.' : 'Couldn’t answer. You may not have signal right now.'}</div>`; }
        finally { fa.disabled = false; }
      };
      fa.onclick = ask; fq.onkeydown = e => { if (e.key === 'Enter') ask(); };
    }
  });
}
function explainAllModal(decks) {
  const todo = () => decks.flatMap(d => d.cards.filter(c => !hasExplain(c)).map(c => ({ c, d })));
  const total = decks.reduce((a, d) => a + d.cards.length, 0);
  modal(`<h2>💡 Download explanations</h2><p class="muted small" style="margin:6px 0 0">Claude writes a breakdown for every card: plain-words meaning, what each letter and term stands for, why it matters, a worked example and a common trap. They're saved on your phone so the Explain button works underground. Needs signal while it runs (a few minutes for all decks; you can stop and resume any time).</p>
    <div class="stack"><div id="st" class="small"></div><div class="progress" style="height:8px"><i id="pb" style="width:0"></i></div>
    <button class="btn primary" id="go">Start</button><button class="btn" data-close>Close</button></div>`, (m) => {
    const st = m.querySelector('#st'), pb = m.querySelector('#pb'), go = m.querySelector('#go');
    const upd = () => { const left = todo().length; st.textContent = left ? `${total - left} of ${total} cards ready · ${left} to go` : `All ${total} cards have explanations ✓`; pb.style.width = ((total - left) / Math.max(1, total) * 100) + '%'; go.disabled = !left; return left; };
    upd();
    let running = false;
    go.onclick = async () => {
      if (running) return; running = true; go.disabled = true; go.textContent = 'Working… keep this open';

function parseBulk(text) {

    let m = l.split('\t'); if (m.length >= 2) return [m[0], m.slice(1).join(' ')];

    }
    return null;

}
