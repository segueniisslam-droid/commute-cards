<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161c">
<title>Commute Cards</title>
<style>
  :root{
    --bg:#f6f4ef; --card:#ffffff; --ink:#1b1d22; --muted:#6b6f78; --line:#e4e1d9;
    --accent:#2f5bea; --accent-ink:#fff; --good:#1f9d5c; --bad:#d64545; --hard:#d98a1c; --easy:#2f8fd9;
    --soft:#eceae3; --shadow:0 1px 2px rgba(0,0,0,.05),0 6px 20px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#14161c; --card:#1e2129; --ink:#eef0f4; --muted:#9aa0ab; --line:#2c3039;
      --accent:#6d8cff; --accent-ink:#0d1020; --soft:#262a33; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);}
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif}
  body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  #app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:16px 16px 28px}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  input,textarea,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:12px 14px;width:100%}
  textarea{resize:vertical;min-height:110px}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
  h1{font-size:26px;letter-spacing:-.02em;margin:4px 0 0}
  h2{font-size:20px;letter-spacing:-.01em;margin:0}
  .muted{color:var(--muted)} .small{font-size:13px}
  .row{display:flex;align-items:center;gap:10px}
  .spacer{flex:1}
  .top{display:flex;align-items:center;gap:8px;margin-bottom:18px;min-height:44px}
  .icon-btn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:20px}
  .icon-btn:active{background:var(--soft)}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 18px;
    border-radius:14px;font-weight:600;background:var(--soft);width:100%}
  .btn.primary{background:var(--accent);color:var(--accent-ink)}
  .btn.ghost{background:transparent;border:1px solid var(--line)}
  .btn:disabled{opacity:.45}
  .btn:active{transform:scale(.985)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 18px}
  .stat{background:var(--card);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
  .stat b{display:block;font-size:24px;letter-spacing:-.02em}
  .stat span{font-size:12px;color:var(--muted)}
  .section-title{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 2px 8px}
  .list{display:flex;flex-direction:column;gap:10px}
  .deck{background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;text-align:left;width:100%}
  .deck .name{font-weight:600}
  .pill{font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
  .pill.due{background:var(--accent);color:var(--accent-ink)}
  .seg{display:flex;background:var(--soft);border-radius:12px;padding:4px;gap:4px}
  .seg button{flex:1;min-height:40px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
  .cardrow{background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:flex-start}
  .cardrow .f{font-weight:600} .cardrow .b{color:var(--muted);font-size:14px}
  .cardrow .txt{flex:1;min-width:0;overflow-wrap:anywhere}
  .progress{height:6px;background:var(--soft);border-radius:999px;overflow:hidden;flex:1}
  .progress i{display:block;height:100%;background:var(--accent);transition:width .25s}
  .stage{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:10px 0}
  .flash{perspective:1200px;min-height:300px;flex:1;max-height:440px;touch-action:pan-y;user-select:none}
  .flash-inner{position:relative;width:100%;height:100%;min-height:300px;transition:transform .45s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
  .flash.flipped .flash-inner{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;background:var(--card);border-radius:22px;box-shadow:var(--shadow);
    backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:28px 22px;text-align:center;overflow:auto}
  .face.back{transform:rotateY(180deg)}
  .face .label{position:absolute;top:14px;left:18px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .face .content{font-size:24px;font-weight:600;letter-spacing:-.01em;overflow-wrap:anywhere;white-space:pre-wrap}
  .face.back .content{font-weight:500;font-size:21px}
  .face .q-small{font-size:14px;color:var(--muted);margin-bottom:14px;white-space:pre-wrap}
  .hint{position:absolute;bottom:14px;left:0;right:0;font-size:13px;color:var(--muted)}
  .grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .grade{min-height:64px;border-radius:14px;font-weight:700;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px}
  .grade small{font-weight:500;opacity:.85;font-size:11px}
  .g0{background:var(--bad)} .g1{background:var(--hard)} .g2{background:var(--good)} .g3{background:var(--easy)}
  .swipe-tag{position:absolute;top:18px;padding:6px 12px;border-radius:10px;font-weight:800;font-size:14px;opacity:0;z-index:3;pointer-events:none}
  .swipe-tag.l{left:18px;background:var(--bad);color:#fff} .swipe-tag.r{right:18px;background:var(--good);color:#fff}
  .choices{display:flex;flex-direction:column;gap:10px}
  .choice{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 16px;text-align:left;min-height:56px;font-weight:500;overflow-wrap:anywhere}
  .choice.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--card))}
  .choice.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--card))}
  .qbox{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:26px 20px;text-align:center}
  .qbox .content{font-size:22px;font-weight:600;overflow-wrap:anywhere;white-space:pre-wrap}
  .feedback{border-radius:14px;padding:14px 16px;font-weight:500}
  .feedback.ok{background:color-mix(in srgb,var(--good) 16%,var(--card))}
  .feedback.no{background:color-mix(in srgb,var(--bad) 14%,var(--card))}
  .done{text-align:center;padding:30px 10px}
  .done .big{font-size:56px;line-height:1}
  .modal-back{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fade .15s}
  .modal{background:var(--bg);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));
    max-height:92vh;overflow:auto;animation:up .2s cubic-bezier(.2,.8,.2,1)}
  @media (min-width:600px){.modal-back{align-items:center}.modal{border-radius:22px}}
  .modal .stack{display:flex;flex-direction:column;gap:12px;margin-top:14px}
  @keyframes fade{from{opacity:0}} @keyframes up{from{transform:translateY(30px);opacity:0}}
  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);
    padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:60;animation:fade .2s;max-width:90vw;text-align:center}
  .sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
  .dot.on{background:var(--good)}
  .empty{text-align:center;padding:26px 12px;color:var(--muted);background:var(--card);border-radius:16px;box-shadow:var(--shadow)}
  .preview{max-height:40vh;overflow:auto;display:flex;flex-direction:column;gap:8px}
  .kbd-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  .player{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#9b4dff));color:#fff;border-radius:20px;padding:16px;box-shadow:var(--shadow);margin-top:12px}
  .avatar{width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-weight:800;font-size:20px}
  .ptitle{font-size:20px;font-weight:800;letter-spacing:-.01em}
  .player .small{color:rgba(255,255,255,.8)}
  .ring{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#fff calc(var(--p)*1%),rgba(255,255,255,.22) 0);position:relative;flex:none}
  .ring::before{content:"";position:absolute;inset:6px;border-radius:50%;background:color-mix(in srgb,var(--accent) 80%,#6b3dcc)}
  .ring span{position:relative;font-size:12px;font-weight:800;line-height:1.1;text-align:center}
  .xpbar{height:8px;background:rgba(255,255,255,.22);border-radius:999px;overflow:hidden;margin:14px 0 6px}
  .xpbar i{display:block;height:100%;background:#fff;border-radius:999px;transition:width .4s}
  .mbar{height:5px;background:var(--soft);border-radius:999px;overflow:hidden;margin-top:8px}
  .mbar i{display:block;height:100%;background:var(--good)}
  .btn.express{background:linear-gradient(135deg,#ff9f1c,#ff5e3a);color:#fff}
  .combo{font-weight:800;font-size:14px;padding:4px 9px;border-radius:999px;background:color-mix(in srgb,#ff7a1a 18%,var(--card));color:#ff6a00;white-space:nowrap}
  .xpchip{font-weight:700;font-size:13px;color:var(--accent);white-space:nowrap}
  .floatxp{position:fixed;left:50%;top:90px;transform:translateX(-50%);font-weight:900;font-size:22px;color:var(--accent);z-index:70;pointer-events:none;animation:floatup .9s ease-out forwards;text-shadow:0 2px 10px rgba(0,0,0,.15)}
  @keyframes floatup{0%{opacity:0;transform:translate(-50%,10px) scale(.8)}20%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-50px) scale(1)}}
  .toasts{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:80;pointer-events:none;width:max-content;max-width:92vw}
  .toasts .toast{position:static;transform:none}
  .hearts{font-size:18px;letter-spacing:2px}
  .tbar{height:8px;background:var(--soft);border-radius:999px;overflow:hidden;flex:1}
  .tbar i{display:block;height:100%;background:linear-gradient(90deg,#ff5e3a,#ff9f1c);transition:width .1s linear}
  .bigscore{font-size:64px;font-weight:900;letter-spacing:-.03em;line-height:1}
  .badges{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .badge{background:var(--card);border-radius:14px;padding:12px;box-shadow:var(--shadow);text-align:center}
  .badge .e{font-size:30px} .badge.locked{opacity:.38;filter:grayscale(1)}
  .badge .t{font-weight:700;font-size:14px;margin-top:4px} .badge .d{font-size:12px;color:var(--muted)}
  .shake{animation:shake .35s}
  @keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
  .goalopts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

  .exsec{background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
  .exsec p{margin:0;white-space:pre-wrap}
  .exh{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-bottom:6px}
  .term{display:flex;gap:12px;padding:7px 0;border-top:1px solid var(--line)} .term:first-of-type{border-top:0}
  .term b{min-width:64px;max-width:40%;color:var(--accent);overflow-wrap:anywhere} .term span{flex:1}
  .exhead{background:var(--soft);border-radius:14px;padding:12px 14px}
  .exhead .q{font-weight:700} .exhead .a{color:var(--muted);margin-top:4px;white-space:pre-wrap}
  .loading{display:flex;align-items:center;gap:10px;color:var(--muted);padding:18px 4px}
  .spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--accent);animation:sp 0.8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .btn.explain{min-height:44px;background:transparent;border:1px dashed color-mix(in srgb,var(--accent) 55%,transparent);color:var(--accent)}

  .wrow{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line)} .wrow:first-of-type{border-top:0}
  .wico{font-size:18px;line-height:1.2;flex:none;width:24px;text-align:center}
  .wplace{font-weight:700;font-size:14px} .wdet{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
  .mwrap{display:flex;flex-direction:column;gap:10px;margin-top:10px}
  .mstmt{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12.5px}
  .mtitle{font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:4px}
  .mhead{font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--muted);margin:6px 0 2px}
  .mline{display:flex;align-items:center;padding:3px 6px;border-radius:6px;color:var(--muted)}
  .mline.tot{font-weight:700}
  .mline.hit{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--ink);font-weight:700}
  .here{margin-left:auto;font-size:10.5px;font-weight:800;color:var(--accent);white-space:nowrap;padding-left:8px}

  .setup{font-style:italic;color:var(--muted);margin-bottom:6px}
  .step{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-top:1px solid var(--line)}
  .sn{flex:none;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:800;display:grid;place-items:center;margin-top:1px}
  .exsec code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9em;background:var(--soft);padding:1px 5px;border-radius:5px;overflow-wrap:anywhere}

  .exsec.like{background:color-mix(in srgb,#ffb703 18%,var(--card));box-shadow:none;border:1px solid color-mix(in srgb,#ffb703 45%,transparent)}
  .exsec.like p{font-size:16.5px;line-height:1.5}
  .moredet{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px}
  .moredet summary{cursor:pointer;font-weight:700;color:var(--accent);list-style:none;display:flex;align-items:center;gap:6px}
  .moredet summary::-webkit-details-marker{display:none}
  .moredet .chev{margin-left:auto;transition:transform .2s} .moredet[open] .chev{transform:rotate(180deg)}
  .moredet .exsec{box-shadow:none;border:1px solid var(--line)}
</style>
</head>
<body>
<div id="app"></div>
<script>
(() => {
'use strict';
const DAY = 864e5;
const KEY = 'commute-cards-v1';
const $app = document.getElementById('app');
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = (t = Date.now()) => { const d = new Date(t); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const newCard = (front, back) => ({ id: uid(), front: front.trim(), back: back.trim(), due: 0, interval: 0, ease: 2.5, reps: 0, lapses: 0 });


const LIBRARY = [
{ id:'fmva-acct', name:'FMVA · Accounting & Financial Statements', text:`
The accounting equation | Assets = Liabilities + Shareholders' equity
Accrual accounting | Revenue is recorded when earned and expenses when incurred, regardless of when cash moves
Matching principle | Expenses are recorded in the same period as the revenue they help generate
The three core financial statements | Income statement, balance sheet, cash flow statement
What does the balance sheet show? | Assets, liabilities and equity at a single point in time
What does the income statement show? | Revenue, expenses and profit over a period of time
Three sections of the cash flow statement | Operating, investing and financing activities
Gross profit | Revenue − Cost of goods sold (COGS)
EBIT | Earnings before interest and taxes (roughly operating income)
EBITDA | EBIT + Depreciation and amortization
Retained earnings roll-forward | Opening RE + Net income − Dividends = Closing RE
Effect of a debit on an asset account | Increases it (debits increase assets and expenses)
Effect of a credit on a liability account | Increases it (credits increase liabilities, equity and revenue)
Depreciation | Spreading the cost of a tangible fixed asset over its useful life
Amortization | Spreading the cost of an intangible asset over its useful life
Straight-line depreciation formula | (Cost − Salvage value) ÷ Useful life
Accounts receivable | Money customers owe the company for goods or services already delivered
Accounts payable | Money the company owes suppliers for goods or services already received
Deferred (unearned) revenue | Cash received before the service is delivered; recorded as a liability
Prepaid expense | Cash paid in advance for a future expense; recorded as a current asset
Working capital | Current assets − Current liabilities
Goodwill | Purchase price above the fair value of the net identifiable assets acquired
`},
{ id:'fmva-ratios', name:'FMVA · Financial Analysis & Ratios', text:`
Gross margin | Gross profit ÷ Revenue
EBITDA margin | EBITDA ÷ Revenue
Net profit margin | Net income ÷ Revenue
Current ratio | Current assets ÷ Current liabilities
Quick (acid-test) ratio | (Cash + Marketable securities + Receivables) ÷ Current liabilities
Debt-to-equity ratio | Total debt ÷ Total shareholders' equity
Interest coverage ratio | EBIT ÷ Interest expense
Net debt | Total debt − Cash and cash equivalents
What does Net debt / EBITDA measure? | Leverage: roughly how many years of EBITDA it would take to repay net debt
Return on equity (ROE) | Net income ÷ Average shareholders' equity
Return on assets (ROA) | Net income ÷ Average total assets
DuPont analysis: ROE = | Net margin × Asset turnover × Equity multiplier
Asset turnover | Revenue ÷ Average total assets
Equity multiplier | Average total assets ÷ Average shareholders' equity
Days sales outstanding (DSO) | Accounts receivable ÷ Revenue × 365
Days inventory outstanding (DIO) | Inventory ÷ COGS × 365
Days payable outstanding (DPO) | Accounts payable ÷ COGS × 365
Cash conversion cycle | DSO + DIO − DPO
Horizontal analysis | Comparing line items across periods to see growth over time
Vertical analysis | Showing each line item as a % of a base, like revenue or total assets
Earnings per share (EPS) | (Net income − Preferred dividends) ÷ Weighted average shares outstanding
Operating leverage | How strongly operating income responds to changes in sales, driven by fixed costs
`},
{ id:'fmva-cf', name:'FMVA · Corporate Finance & Math', text:`
Future value formula | FV = PV × (1 + r)^n
Present value formula | PV = FV ÷ (1 + r)^n
Net present value (NPV) | Sum of discounted future cash flows minus the initial investment
NPV decision rule | Accept projects with NPV > 0
Internal rate of return (IRR) | The discount rate at which NPV equals zero
IRR decision rule | Accept if IRR is above the hurdle rate (cost of capital)
WACC formula | E/(D+E) × Re + D/(D+E) × Rd × (1 − tax rate)
Why is the cost of debt tax-adjusted in WACC? | Interest expense is tax-deductible, creating a tax shield
CAPM formula | Re = Rf + β × (Rm − Rf)
Beta (β) | A stock's volatility relative to the overall market
Equity risk premium | Expected market return minus the risk-free rate (Rm − Rf)
Value of a perpetuity | Cash flow ÷ r
Value of a growing perpetuity | CF₁ ÷ (r − g)
Annuity | A series of equal payments at regular intervals for a fixed period
Rule of 72 | Years to double ≈ 72 ÷ annual interest rate (%)
Payback period | Time needed for cumulative cash flows to recover the initial investment
Capital structure | The mix of debt and equity used to fund a company
Three main corporate finance decisions | Investing (capital budgeting), financing (capital structure) and payout (dividends)
Effective annual rate (EAR) | (1 + nominal rate ÷ m)^m − 1, where m = compounding periods per year
`},
{ id:'fmva-excel', name:'FMVA · Excel for Finance', text:`
XNPV vs NPV | XNPV uses an exact date for each cash flow; NPV assumes equal periods
XIRR | IRR for cash flows that happen on specific, irregular dates
=PMT(rate, nper, pv) | Payment per period for a loan or annuity
INDEX + MATCH | MATCH finds the position; INDEX returns the value at that position
XLOOKUP | Searches one range and returns the match from another, in any direction
SUMIFS | Adds up values that meet one or more criteria
Absolute reference $A$1 | Row and column stay fixed when the formula is copied
F4 key (Windows) | Cycles a reference through $A$1, A$1, $A1 and A1
IFERROR | Returns a fallback value when a formula produces an error
Data table (What-If Analysis) | Shows how an output changes across one or two varying inputs; used for sensitivity tables
Goal Seek | Finds the input value needed to reach a target output
Usual source of circular references in models | Interest depends on cash/debt balances, which depend on interest; solve with iterative calc and a circuit breaker
Model color code: blue font | Hard-coded inputs
Model color code: black font | Formulas and calculations
Model color code: green font | Links to other worksheets
EOMONTH | Returns the last day of the month a set number of months before or after a date
Ctrl + [ (Windows) | Jumps to the cells referenced by the selected formula
Alt + = (Windows) | AutoSum
Why avoid hard-coded numbers inside formulas? | They hide assumptions and break when inputs change
CHOOSE in financial models | Switches between scenarios such as base, upside and downside cases
`},
{ id:'fmva-3s', name:'FMVA · 3-Statement Modeling', text:`
Order for building a 3-statement model | Assumptions → income statement → balance sheet → cash flow statement → link and balance
Where does net income link to? | Top of cash from operations, and retained earnings on the balance sheet
Why is depreciation added back on the cash flow statement? | It's a non-cash expense
Increase in accounts receivable: effect on cash | Reduces cash (subtracted in cash from operations)
Increase in accounts payable: effect on cash | Increases cash (added in cash from operations)
Where does CapEx appear on the cash flow statement? | Investing activities, as an outflow
PP&E roll-forward | Opening PP&E + CapEx − Depreciation = Closing PP&E
Debt schedule roll-forward | Opening debt + Issuance − Repayment = Closing debt
Ending cash on the cash flow statement links to | Cash on the balance sheet
Balance check | Total assets − (Total liabilities + Equity) should equal 0
Common revenue drivers | Growth rate, or price × volume (units × average selling price)
How to forecast accounts receivable | With DSO, based on revenue
How to forecast inventory | With DIO, based on COGS
How to forecast accounts payable | With DPO, based on COGS
Main supporting schedules | Working capital, PP&E and depreciation, debt and interest, equity
Increase in net working capital: effect on cash | Uses cash, reducing free cash flow
Where do dividends appear? | Financing activities on the cash flow statement; they also reduce retained earnings
Common reasons a balance sheet won't balance | A missing cash flow link, a wrong sign, an item not flowing through cash, or a retained earnings error
`},
{ id:'fmva-val', name:'FMVA · Valuation: DCF & Comps', text:`
Three main valuation methods | DCF analysis, comparable company analysis, precedent transactions
Unlevered free cash flow (FCFF) | EBIT × (1 − t) + D&A − CapEx − Increase in NWC
Levered free cash flow (FCFE) | FCFF − Interest × (1 − t) + Net borrowing
Discount rate for unlevered free cash flow | WACC
Discount rate for levered free cash flow | Cost of equity
Terminal value: perpetuity growth method | FCFₙ × (1 + g) ÷ (WACC − g)
Terminal value: exit multiple method | Final-year metric (e.g. EBITDA) × an exit multiple
Enterprise value formula | Market cap + Debt + Preferred stock + Minority interest − Cash
From enterprise value to equity value | Equity value = EV − Net debt − Preferred stock − Minority interest
Implied share price | Equity value ÷ Diluted shares outstanding
Mid-year convention | Discounts each year's cash flow as if received mid-year: period t − 0.5
Typical share of DCF value from terminal value | Often 60–80% or more, so its assumptions matter a lot
P/E ratio | Share price ÷ EPS
Why use EV multiples instead of equity multiples? | EV multiples aren't distorted by differences in capital structure
Matching rule for multiples | EV goes with pre-interest metrics (revenue, EBITDA, EBIT); equity value with post-interest metrics (net income)
Comparable company analysis | Valuing a company with the trading multiples of similar public companies
Precedent transactions | Valuing with multiples paid in past M&A deals; usually higher because they include a control premium
Football field chart | A bar chart comparing valuation ranges from different methods
Sensitivity table in a DCF | Shows the value across ranges of key inputs like WACC and terminal growth
Sensible terminal growth rate | No higher than long-term GDP/inflation growth, typically about 2–3%
Treasury stock method | Assumes in-the-money options are exercised and the proceeds buy back shares at market price
Intrinsic vs relative valuation | Intrinsic (DCF) uses the company's own cash flows; relative uses peers' multiples
`},
{ id:'fmva-bud', name:'FMVA · Budgeting, Forecasting & Presentation', text:`
Top-down forecasting | Start with total market size, then apply a market share to estimate revenue
Bottom-up forecasting | Build revenue from drivers like units, customers, price and capacity
Zero-based budgeting | Every expense is justified from zero each period, not based on last year
Incremental budgeting | Uses last period's budget as the base and adjusts it up or down
Rolling forecast | A forecast that adds a new period each time one ends, keeping a constant horizon
Variance analysis | Comparing actual results to budget or forecast and explaining the differences
Favorable vs unfavorable variance | Favorable: better than budget (more revenue or less cost); unfavorable: worse than budget
Scenario vs sensitivity analysis | Scenario changes several inputs together; sensitivity changes one or two at a time
Fixed vs variable costs | Fixed costs stay the same as volume changes; variable costs move with volume
Contribution margin | Revenue − Variable costs
Break-even units | Fixed costs ÷ Contribution margin per unit
Waterfall chart | Shows how a starting value is increased and decreased step by step to reach an ending value
Principles of a good dashboard | Key metrics up front, little clutter, consistent formatting, built around the decision
Pitchbook | A presentation banks and advisors use to pitch their services or present a deal
`},
];

const BUNDLED_EX = {"fmva-acct":[{"plain":"Everything a company owns had to be paid for somehow: either with borrowed money (liabilities) or with the owners' money (equity). So what it owns always equals what it owes plus what the owners put in.","terms":[{"t":"Assets","d":"things the company owns or controls that have value: cash, inventory, machines, buildings"},{"t":"Liabilities","d":"money the company owes to others: bank loans, unpaid supplier bills"},{"t":"Shareholders' equity","d":"the owners' share: money they invested plus profits the company kept"}],"use":"Every balance sheet is built on this. When you build a 3-statement model, a \"balance check\" row tests this equation every year; if it fails, your model has a mistake.","example":"You start a coffee cart. You put in $40 of your own savings and borrow $60 from a bank.\nYou now have $100 of cash and equipment (assets).\nYou owe the bank $60 (liabilities); the other $40 is yours (equity).\n$100 = $60 + $40 ✓","tip":"Every transaction changes at least two items so the equation stays balanced: buy a $10 machine with cash and one asset goes up $10 while another (cash) goes down $10.","like":"Your car is worth $10,000 and you still owe the bank $6,000 on it, so $4,000 of it is really yours. Car = what you owe + what's yours. A company's balance sheet works exactly the same way."},{"plain":"You record a sale when you actually deliver the product or service, and a cost when you actually use it up, even if the cash moves at a different time.","terms":[{"t":"Accrual accounting","d":"record revenue when it's earned and costs when they're incurred"},{"t":"Cash accounting","d":"record things only when cash goes in or out (small businesses sometimes do this)"},{"t":"Accounts receivable","d":"sales you've made where the customer hasn't paid yet"}],"use":"This is why a company can show a profit but still run out of cash. It's the reason the cash flow statement exists, and why your model converts net income back into cash.","example":"In December you finish a $1,000 design job. The client pays you in January.\nDecember: you record $1,000 of revenue (you earned it) and $1,000 of accounts receivable.\nJanuary: cash +$1,000, receivable −$1,000. No new revenue.","tip":"If net income is high but cash from operations is low, look at receivables and inventory: they usually explain the gap.","like":"You mow a neighbor's lawn on Saturday and they pay you next Friday. You earned the money on Saturday; the payment just came later. Accrual accounting counts it on Saturday."},{"plain":"Each cost is recorded in the same period as the sales it helped create, so each period's profit is fair and not distorted by when things were paid.","terms":[{"t":"Matching principle","d":"put expenses in the same period as the revenue they produce"},{"t":"COGS (cost of goods sold)","d":"the cost of the products you actually sold this period"},{"t":"Depreciation","d":"spreading a long-lasting asset's cost over the years it's used"}],"use":"It's why big purchases like machines aren't expensed all at once, and why inventory only becomes an expense when it's sold.","example":"A bakery buys a $50,000 oven that will last 5 years.\nInstead of a $50,000 expense in year 1, it records $10,000 a year for 5 years.\nEach year's bread sales are matched with that year's share of the oven's cost.","tip":"Inventory bought this year but sold next year is an expense next year, not this year.","like":"You buy a $300 phone that you'll use for 3 years. It's fairer to say it costs you $100 a year than $300 in year one and nothing after. That's matching: the cost goes in the same years as the benefit."},{"plain":"Three reports that together tell a company's financial story: was it profitable, what does it own and owe, and where did its cash go.","terms":[{"t":"Income statement","d":"profit over a period (revenue − expenses = net income)"},{"t":"Balance sheet","d":"what it owns and owes on one specific date"},{"t":"Cash flow statement","d":"cash coming in and going out over a period"}],"use":"Every financial model is built around these three, linked together: net income feeds the cash flow statement and the balance sheet, and ending cash feeds the balance sheet.","example":"A company earns $10 of net income this year.\nIncome statement: shows the $10 profit.\nCash flow statement: starts with that $10, then adjusts it to actual cash.\nBalance sheet: retained earnings grow by $10 (minus any dividends).","tip":"Exam questions love \"If X happens, what changes on each statement?\" Learn how the three link.","like":"Think of your own money: a yearly summary of what you earned minus what you spent (income statement), a snapshot of what you own and owe today (balance sheet), and your bank statement showing where the cash actually went (cash flow statement)."},{"plain":"A photo of the company on one date: what it owns, what it owes, and what's left for the owners.","terms":[{"t":"Point in time","d":"a single date, e.g. \"as of December 31\""},{"t":"Current","d":"used up or due within 12 months"},{"t":"Non-current","d":"lasting or due after more than 12 months"}],"use":"Analysts read it to check if a company can pay its bills soon (liquidity) and how much debt it carries (leverage).","example":"As of December 31, a shop has:\nAssets: cash $100 + inventory $150 + store fittings $250 = $500\nLiabilities: supplier bills $100 + bank loan $200 = $300\nEquity: $500 − $300 = $200","tip":"Balance sheet = a photo on one day. Income statement and cash flow statement = a video of the whole year.","like":"A selfie of your finances on one day: money in the bank, what your car is worth, minus your student loan and credit card balance. Take the selfie on another day and it looks different."},{"plain":"A report of how much the company sold and spent over a period (a quarter or a year), and how much profit was left at the end.","terms":[{"t":"Revenue","d":"total sales, also called the \"top line\""},{"t":"Expenses","d":"the costs: COGS, salaries, rent, interest, taxes"},{"t":"Net income","d":"what's left after every expense, the \"bottom line\""}],"use":"It's the starting point for most analysis: margins, earnings per share, and the revenue and cost forecasts in your model.","example":"A shop's year:\nRevenue 100 − Cost of goods 60 = Gross profit 40\n− Rent and salaries 25 = Operating profit (EBIT) 15\n− Interest 3 − Tax 3 = Net income 9","tip":"You'll also see it called the P&L (profit and loss statement).","like":"A yearly summary for a lemonade stand: lemonade sold, minus lemons, cups and stall rent, equals what you actually made."},{"plain":"The cash flow statement splits cash into three buckets: cash from running the business, cash spent on or received from long-term investments, and cash from lenders and owners.","terms":[{"t":"Operating (CFO)","d":"cash from day-to-day business; starts with net income"},{"t":"Investing (CFI)","d":"buying or selling long-term assets like machines (CapEx) or whole companies"},{"t":"Financing (CFF)","d":"borrowing or repaying debt, issuing or buying back shares, paying dividends"}],"use":"Looking at the three sections tells you whether the business funds itself. A healthy company usually makes enough operating cash to pay for its investing.","example":"A company starts the year with $100 cash.\nOperating: +$50 (customers paid more than costs)\nInvesting: −$30 (bought new equipment)\nFinancing: −$10 (paid dividends)\nEnd cash = 100 + 50 − 30 − 10 = $110","tip":"Dividends paid go in financing, not operating.","like":"Your bank account over a year has three kinds of money: pay from your job (operating), buying a car or selling an old bike (investing), and money borrowed from or paid back to the bank or your parents (financing)."},{"plain":"What's left from sales after paying the direct cost of the products you sold.","terms":[{"t":"Revenue","d":"total sales"},{"t":"COGS (cost of goods sold)","d":"costs directly tied to making or buying what you sold: materials, factory labor"}],"use":"Gross profit shows how profitable the product itself is before overhead. Divide it by revenue to get gross margin, a key number for comparing companies.","example":"A T-shirt shop sells $200 of shirts. Making those shirts cost $120 (fabric, printing).\nGross profit = 200 − 120 = $80\nGross margin = 80 ÷ 200 = 40%","tip":"Office rent, marketing and head-office salaries are NOT in COGS; they come after gross profit as operating expenses.","like":"You sell a cake for $20 and the ingredients cost $8. The $12 left is your gross profit, before paying for the oven, electricity or your market stall."},{"plain":"Profit from running the business, before paying interest to lenders and before taxes.","terms":[{"t":"EBIT","d":"Earnings Before Interest and Taxes"},{"t":"Operating expenses","d":"running costs like rent, salaries, marketing"},{"t":"Operating income","d":"revenue − COGS − operating expenses"}],"use":"Because it ignores interest, EBIT lets you compare two companies' operations even if one has lots of debt and the other has none. It's also the starting point for unlevered free cash flow.","example":"Shop: Gross profit $80 − rent, salaries and marketing $50\nEBIT = $30\n(Then interest and tax come off to reach net income.)","tip":"EBIT and operating income are usually the same number; small differences come from one-off or non-operating items.","like":"What your lemonade stand makes after lemons, cups and stall rent, but before paying interest on the loan from your parents and before tax."},{"plain":"EBIT with depreciation and amortization added back. Since those two aren't cash payments, EBITDA is a rough stand-in for the cash the business earns from operations.","terms":[{"t":"EBITDA","d":"Earnings Before Interest, Taxes, Depreciation and Amortization"},{"t":"D&A","d":"depreciation (physical assets) + amortization (intangible assets): accounting expenses with no cash going out"}],"use":"The most-used profit number in valuation: companies are often priced as a multiple of EBITDA (EV/EBITDA), and debt levels are measured as Debt ÷ EBITDA.","example":"A company has EBIT of $30.\nIts income statement includes $10 of depreciation (machines wearing out).\nEBITDA = 30 + 10 = $40","tip":"EBITDA ignores spending on new equipment and working capital, so it's NOT the same as cash flow.","like":"Your stand's profit if you ignore the slow wear and tear on your blender, which doesn't cost you any cash each month. It's a rough measure of the cash the stand brings in."},{"plain":"Retained earnings are all the profits a company has kept (not paid out) since it started. Each year: take last year's total, add this year's profit, subtract dividends paid.","terms":[{"t":"Retained earnings (RE)","d":"accumulated profits kept in the business; part of equity on the balance sheet"},{"t":"Net income","d":"this year's profit, from the income statement"},{"t":"Dividends","d":"profits paid out to shareholders"}],"use":"This is the bridge from the income statement to the balance sheet. In your model, it's one of the key links that makes the balance sheet balance.","example":"Retained earnings at the start of the year: $100\nThis year's net income: +$20\nDividends paid: −$5\nRetained earnings at year end = $115","tip":"A loss shrinks retained earnings, just like a profit grows them.","like":"A savings jar: start with what's in it, add what you earned this year, take out what you spent on treats (dividends). What's left is the new total."},{"plain":"In bookkeeping every entry has two sides: debit (left) and credit (right). For an asset account, a debit makes it go up.","terms":[{"t":"Debit (Dr)","d":"the left side of an entry"},{"t":"Credit (Cr)","d":"the right side of an entry"},{"t":"Journal entry","d":"a record of a transaction with equal debits and credits"}],"use":"Debits and credits always match, which is what keeps assets = liabilities + equity in balance.","example":"You buy $500 of inventory and pay cash.\nDebit Inventory $500 → inventory (an asset) goes up\nCredit Cash $500 → cash (an asset) goes down\nTotal assets unchanged; the entry balances.","tip":"Memory trick DEALER: Dividends, Expenses, Assets go up with Debits; Liabilities, Equity, Revenue go up with credits.","like":"Picture a notebook with two columns. Buy $500 of stock with cash: write $500 on the left for stock (it went up) and $500 on the right for cash (it went down). For things you own, left means \"more\"."},{"plain":"For a liability account (money you owe), a credit makes it go up.","terms":[{"t":"Credit (Cr)","d":"the right side of an entry"},{"t":"Liability","d":"money owed, like a loan or a supplier bill"},{"t":"Debit (Dr)","d":"the left side; for a liability it makes it go down"}],"use":"You use this whenever you record borrowing, supplier bills or customer prepayments.","example":"You borrow $1,000 from the bank.\nDebit Cash $1,000 → cash (asset) goes up\nCredit Loan payable $1,000 → what you owe (liability) goes up\nLater you repay $200: debit the loan (it goes down) and credit cash.","tip":"Liabilities, equity and revenue all live on the \"credit\" side, so credits increase them.","like":"For things you owe, it's the other way round: the right column means \"owe more\". Borrow $1,000 and the loan gets $1,000 on the right, while your cash gets $1,000 on the left."},{"plain":"Instead of counting a machine's whole cost as an expense in the year you buy it, you spread that cost over the years you'll use it.","terms":[{"t":"Tangible asset","d":"something physical, like a truck, machine or building (part of PP&E)"},{"t":"Useful life","d":"how many years you expect to use it"},{"t":"Book value","d":"cost minus all depreciation so far"}],"use":"Depreciation shows up in three places in your model: an expense on the income statement, an add-back on the cash flow statement, and a reduction in PP&E on the balance sheet.","example":"A delivery company buys a truck for $40,000 and expects to use it for 4 years.\nDepreciation = $40,000 ÷ 4 = $10,000 a year\nBook value: $40k → $30k → $20k → $10k → $0","tip":"Land is never depreciated because it doesn't wear out.","like":"A $40,000 delivery truck doesn't disappear on day one; it wears out over about 4 years. So you count $10,000 of its cost each year, like spreading a big bill over the years you use it."},{"plain":"The same idea as depreciation, but for things you can't touch, like patents, software licenses or customer lists: their cost is spread over the years they're useful.","terms":[{"t":"Intangible asset","d":"something valuable but not physical: a patent, a brand license, software"},{"t":"Useful life","d":"how long it will provide value, e.g. a patent's legal life"}],"use":"Like depreciation, it's a non-cash expense: added back on the cash flow statement, and it's the \"A\" in EBITDA.","example":"A drug company buys a patent for $100,000 that protects its product for 10 years.\nAmortization = $100,000 ÷ 10 = $10,000 a year","tip":"Goodwill is NOT amortized; it's checked each year and written down only if it has lost value. (And \"amortizing a loan\" means paying down a loan, a completely different meaning.)","like":"The same as depreciation, but for things you can't touch. Pay $100,000 for a 10-year license to sell a brand's T-shirts? Count $10,000 a year."},{"plain":"The simplest way to depreciate: the same amount every year. Take the part of the cost you'll use up (cost minus what it's worth at the end) and divide by the years.","terms":[{"t":"Cost","d":"what you paid for the asset"},{"t":"Salvage value","d":"what you expect to sell it for at the end"},{"t":"Useful life","d":"number of years you'll use it"}],"use":"It's the default method in most financial models and in exam questions unless another method is named.","example":"A factory machine costs $12,000. After 5 years you expect to sell it for $2,000.\nValue used up = 12,000 − 2,000 = $10,000\nDepreciation = 10,000 ÷ 5 = $2,000 every year","tip":"A common mistake is forgetting to subtract the salvage value first.","like":"You buy a car for $12,000 and plan to sell it for $2,000 after 5 years. It loses $10,000 over 5 years, so $2,000 a year, the same every year."},{"plain":"Money customers owe you for things you've already delivered to them but they haven't paid for yet.","terms":[{"t":"Accounts receivable (AR)","d":"unpaid customer invoices; a current asset"},{"t":"Credit terms","d":"how long customers get to pay, e.g. \"30 days\""},{"t":"DSO","d":"average number of days customers take to pay"}],"use":"In your model you forecast AR using DSO. When AR grows, cash goes down (money is stuck with customers), which shows up on the cash flow statement.","example":"You sell $5,000 of goods and give the customer 30 days to pay.\nToday: revenue +$5,000, AR +$5,000 (no cash yet)\n30 days later: customer pays → cash +$5,000, AR −$5,000","tip":"If AR grows faster than sales, customers are paying more slowly. That's a warning sign.","like":"A friend borrows $20 for lunch and says \"I'll pay you Friday.\" That $20 is money owed to you: a receivable."},{"plain":"Bills you owe to suppliers for things you've already received but haven't paid for yet.","terms":[{"t":"Accounts payable (AP)","d":"unpaid supplier bills; a current liability"},{"t":"Payment terms","d":"how long you have to pay, e.g. 45 days"},{"t":"DPO","d":"average number of days you take to pay suppliers"}],"use":"In your model you forecast AP using DPO. When AP grows, you're keeping cash longer, so cash goes up on the cash flow statement.","example":"A restaurant receives $3,000 of food from a supplier and has 45 days to pay.\nToday: inventory +$3,000, AP +$3,000 (no cash out yet)\nDay 45: pays → cash −$3,000, AP −$3,000","tip":"An increase in AP is a source of cash; paying suppliers down uses cash.","like":"The opposite: a café lets you pay your tab at the end of the month. Until you pay, that tab is a payable: money you owe."},{"plain":"A customer pays you before you've delivered. Until you deliver, you owe them the product or service, so it's recorded as a liability, not as revenue.","terms":[{"t":"Deferred (unearned) revenue","d":"cash received for something not yet delivered"},{"t":"Liability","d":"something you owe (here, a service)"},{"t":"Recognize revenue","d":"move it into revenue as you deliver"}],"use":"Very common in subscriptions and software. When deferred revenue grows, operating cash flow gets a boost, because customers paid upfront.","example":"A customer pays $1,200 on January 1 for a 12-month gym membership.\nJan 1: cash +$1,200 and deferred revenue +$1,200 (a liability)\nEnd of each month: $100 moves from deferred revenue into revenue\nAfter 12 months: deferred revenue is $0, revenue is $1,200","tip":"Cash arrived on day 1, but it only becomes revenue as you deliver.","like":"You pay a gym $1,200 upfront for a whole year. The gym hasn't earned it yet; it owes you 12 months of workouts, and it earns $100 for each month that passes."},{"plain":"You paid for something in advance, like a year of insurance or rent. Since you'll get the benefit in the future, it's recorded as an asset, and it turns into an expense as time passes.","terms":[{"t":"Prepaid expense","d":"a cost paid before you use it"},{"t":"Current asset","d":"something of value used up within 12 months"},{"t":"Expense","d":"the cost recorded on the income statement as you use it"}],"use":"It's part of working capital in your model; a growing prepaid balance uses cash.","example":"On January 1 you pay $6,000 for 6 months of insurance.\nJan 1: prepaid +$6,000, cash −$6,000\nEnd of each month: insurance expense $1,000, prepaid −$1,000\nBy July 1: prepaid is $0","tip":"Opposite pair: prepaid expense = you paid early (asset); deferred revenue = the customer paid early (liability).","like":"You pay 6 months of phone insurance upfront. On day one you \"own\" 6 months of cover; each month, one of those months gets used up."},{"plain":"Short-term resources minus short-term obligations: the cushion a business has to run day to day.","terms":[{"t":"Current assets","d":"cash, receivables, inventory, prepaids (turn into cash within a year)"},{"t":"Current liabilities","d":"supplier bills, short-term debt, other amounts due within a year"},{"t":"Net working capital (NWC)","d":"in models, usually current assets minus current liabilities, excluding cash and debt"}],"use":"In a model, it's the CHANGE in working capital each year that matters: if it goes up, the business tied up more cash, which reduces free cash flow.","example":"A shop has current assets of $300 (cash, stock, money owed by customers).\nIt has current liabilities of $200 (supplier bills, short-term loan).\nWorking capital = 300 − 200 = $100","tip":"Don't confuse this with the current ratio (300 ÷ 200 = 1.5x): one is a subtraction, the other a division.","like":"Your cash, the money people owe you and the stuff you could sell soon, minus the bills due soon. It's your short-term cushion, like checking your bank balance covers this month's bills."},{"plain":"When you buy a company for more than its assets are worth (after subtracting its debts), the extra you paid is called goodwill. It represents things like brand, customers, team and expected synergies.","terms":[{"t":"Fair value","d":"what the target's assets and liabilities are really worth today"},{"t":"Net identifiable assets","d":"identifiable assets (cash, equipment, patents) minus liabilities"},{"t":"Impairment","d":"writing goodwill down if it loses value"}],"use":"Goodwill appears on the buyer's balance sheet after every acquisition. You'll see it in M&A models and when reading the balance sheets of companies that grow by buying others.","example":"A company buys a smaller rival for $500m.\nThe rival's assets minus its debts are worth $350m.\nGoodwill = 500 − 350 = $150m, added to the buyer's balance sheet","tip":"Goodwill isn't amortized; it's tested every year and written down only if it's impaired.","like":"You buy your neighbor's lemonade stand for $500, but the stand, lemons and cups are only worth $350. The extra $150 pays for its great corner spot and loyal customers. That's goodwill."}],"fmva-ratios":[{"plain":"The share of every sales dollar that's left after paying for the product itself.","terms":[{"t":"Gross profit","d":"revenue minus cost of goods sold"},{"t":"Revenue","d":"total sales"},{"t":"Margin","d":"a profit expressed as a % of revenue"}],"use":"Gross margin shows pricing power and production efficiency. Analysts compare it across years and against competitors in the same industry.","example":"A company sells $200 of goods that cost $120 to make.\nGross profit = 200 − 120 = $80\nGross margin = 80 ÷ 200 = 40%\nSo for every $1 of sales, 40¢ is left to pay overhead and make profit.","tip":"Margins vary hugely by industry (software 70%+, supermarkets ~25%), so only compare similar companies.","like":"Out of every $1 a cake sells for, how much is left after paying for the ingredients? If 40¢ is left, the gross margin is 40%."},{"plain":"The share of every sales dollar that turns into EBITDA, a rough measure of cash profit from operations.","terms":[{"t":"EBITDA","d":"earnings before interest, taxes, depreciation and amortization"},{"t":"Revenue","d":"total sales"}],"use":"Used to compare how efficiently companies run their operations, regardless of debt, tax and accounting for assets. Often looked at next to EV/EBITDA when valuing a company.","example":"A company has $200 of revenue and $40 of EBITDA.\nEBITDA margin = 40 ÷ 200 = 20%\nEach $1 of sales produces 20¢ of operating cash-like profit.","tip":"A high EBITDA margin can hide heavy spending on equipment, so check CapEx too.","like":"Out of every $1 your lemonade stand takes in, how much is left after all the running costs (lemons, cups, rent, wages), before loan interest, tax and equipment wear and tear?"},{"plain":"The share of every sales dollar that's left as profit after paying absolutely everything, including interest and taxes.","terms":[{"t":"Net income","d":"final profit after all expenses"},{"t":"Revenue","d":"total sales"}],"use":"Shows overall profitability for shareholders. Because interest and tax affect it, it's less useful than EBITDA margin for comparing companies with different debt levels.","example":"A company has $100 of revenue and $9 of net income.\nNet margin = 9 ÷ 100 = 9%\nOf each $1 of sales, 9¢ ends up as profit for shareholders.","tip":"Two identical businesses can have very different net margins just because one carries much more debt (more interest).","like":"Out of every $1 a shop takes at the till, how many cents does the owner actually keep after paying everyone, including the bank and the taxman?"},{"plain":"Checks whether a company can pay the bills due in the next 12 months using the assets it will turn into cash in the next 12 months.","terms":[{"t":"Current assets","d":"cash, receivables, inventory, prepaids"},{"t":"Current liabilities","d":"supplier bills, short-term debt, other amounts due within 12 months"},{"t":"Liquidity","d":"the ability to pay short-term bills"}],"use":"Lenders and credit analysts use it as a quick first test of short-term financial health.","example":"A company has $300 of current assets and $200 of current liabilities.\nCurrent ratio = 300 ÷ 200 = 1.5x\nIt has $1.50 of short-term assets for every $1 of short-term bills.","tip":"Below 1.0x can mean trouble paying bills; very high can mean idle cash or too much inventory.","like":"Do your bank balance and the money people owe you cover this month's bills? $1.50 for every $1 of bills = 1.5x."},{"plain":"A stricter version of the current ratio that leaves out inventory, because inventory can take a long time to sell and turn into cash.","terms":[{"t":"Marketable securities","d":"investments that can be sold for cash quickly"},{"t":"Receivables","d":"money customers owe"},{"t":"Current liabilities","d":"amounts due within 12 months"}],"use":"Useful for businesses with slow-moving stock (like manufacturers or retailers) where the current ratio might look healthier than reality.","example":"A company has cash $50, marketable securities $20, receivables $80, inventory $100. Current liabilities are $200.\nQuick assets = 50 + 20 + 80 = $150 (inventory left out)\nQuick ratio = 150 ÷ 200 = 0.75x","tip":"Leaving out inventory is the whole point of this ratio.","like":"The same check, but you're not allowed to count the stuff in your garage you'd have to sell first. Only cash and money owed to you count."},{"plain":"Shows how much the company is funded by borrowing compared with the owners' own money.","terms":[{"t":"Total debt","d":"all interest-bearing borrowings (loans, bonds)"},{"t":"Shareholders' equity","d":"the owners' stake on the balance sheet"},{"t":"Leverage","d":"using borrowed money"}],"use":"Lenders and analysts use it to judge financial risk: the more debt, the bigger the fixed interest bill and the riskier the company.","example":"A company has $300 of loans and bonds and $200 of shareholders' equity.\nDebt-to-equity = 300 ÷ 200 = 1.5x\nIt has borrowed $1.50 for every $1 the owners put in.","tip":"Usually only interest-bearing debt counts, not supplier bills (accounts payable).","like":"Your home: a $300k mortgage and $200k of your own money in it. You've borrowed $1.50 for every $1 of yours."},{"plain":"How many times the company's operating profit could pay its yearly interest bill.","terms":[{"t":"EBIT","d":"operating profit, before interest and tax"},{"t":"Interest expense","d":"the interest paid on debt this year"},{"t":"Covenant","d":"a rule in a loan agreement the borrower must meet"}],"use":"Lenders use it to judge whether a company can comfortably afford its debt. Loan agreements often require it to stay above a minimum.","example":"A company makes $30 of operating profit and pays $6 of interest a year.\nInterest coverage = 30 ÷ 6 = 5.0x\nIt earns five times what it needs to pay its lenders.","tip":"Below about 1.5x is a red flag: a small drop in profit could make interest unaffordable.","like":"You earn $3,000 a month and your loan payments are $600. You could cover them 5 times over. Lenders like this number big."},{"plain":"The debt that would be left if the company used all its cash to pay off its loans.","terms":[{"t":"Total debt","d":"all interest-bearing borrowings"},{"t":"Cash and cash equivalents","d":"cash plus very short-term, easy-to-sell investments"}],"use":"Net debt is the bridge between enterprise value and equity value, and it's the top half of the Net debt/EBITDA leverage ratio.","example":"A company owes $500 to lenders and has $120 in the bank.\nNet debt = 500 − 120 = $380\nIf it used all its cash on the loans, it would still owe $380.","tip":"If cash is bigger than debt, net debt is negative and the company is in a \"net cash\" position.","like":"You owe $5,000 on your credit card but have $1,200 in savings. If you used the savings, you'd still owe $3,800. That's your net debt."},{"plain":"Roughly how many years it would take to pay off the company's net debt using its current EBITDA.","terms":[{"t":"Net debt","d":"debt minus cash"},{"t":"EBITDA","d":"operating profit before interest, taxes, depreciation and amortization"},{"t":"Leverage","d":"how much debt a company carries"}],"use":"The standard leverage measure used by banks, rating agencies and private equity firms when deciding how much a company can borrow.","example":"A company has $380 of net debt and earns $95 of EBITDA a year.\nNet debt / EBITDA = 380 ÷ 95 = 4.0x\nIt would take about 4 years of EBITDA to repay its net debt.","tip":"Above about 4–5x is usually seen as highly levered, though acceptable levels vary by industry.","like":"You owe $40,000 and can put $10,000 a year toward it. It would take about 4 years to clear. That \"4\" is what this ratio tells you."},{"plain":"How much profit the company makes for every dollar the shareholders have invested.","terms":[{"t":"ROE","d":"return on equity"},{"t":"Net income","d":"final profit"},{"t":"Average equity","d":"(equity at the start of the year + at the end) ÷ 2"}],"use":"The key measure of returns to owners. Investors compare ROE with the return they require (cost of equity) to see if the company creates value.","example":"A company makes $20 of profit. Its equity was $150 at the start of the year and $170 at the end.\nAverage equity = (150 + 170) ÷ 2 = $160\nROE = 20 ÷ 160 = 12.5%","tip":"Use AVERAGE equity because profit is earned over the whole year, while equity is a single-date number.","like":"You put $1,000 of your own money into a side business and it makes $125 profit this year. That's a 12.5% return on your money."},{"plain":"How much profit the company makes from everything it owns.","terms":[{"t":"ROA","d":"return on assets"},{"t":"Net income","d":"final profit"},{"t":"Average total assets","d":"(assets at the start of the year + at the end) ÷ 2"}],"use":"Shows how efficiently a company uses its assets. Useful to compare asset-heavy businesses (factories, banks) with asset-light ones (software).","example":"A company makes $20 of profit and has $400 of assets on average.\nROA = 20 ÷ 400 = 5%\nEvery $1 of assets generates 5¢ of profit a year.","tip":"Banks have low ROA (around 1%) because they hold huge amounts of assets (loans).","like":"A food truck and its kit are worth $40,000 and it makes $2,000 profit a year. Every $1 of stuff it owns earns 5¢."},{"plain":"A way to break ROE into three parts to see WHY it's high or low: is it profit margins, using assets efficiently, or lots of debt?","terms":[{"t":"Net margin","d":"net income ÷ revenue (profitability)"},{"t":"Asset turnover","d":"revenue ÷ assets (efficiency)"},{"t":"Equity multiplier","d":"assets ÷ equity (leverage, i.e. debt)"}],"use":"When two companies have the same ROE, DuPont shows if one gets there with strong margins and the other just with heavy borrowing.","example":"A company has a 10% net margin, asset turnover of 0.8x and an equity multiplier of 2.0x.\nROE = 10% × 0.8 × 2.0 = 16%\nWithout debt (multiplier 1.0x) its ROE would only be 8%.","tip":"More debt pushes ROE up, but also makes the company riskier.","like":"Two friends both earn 16% on their money. One sells at high prices; the other borrowed a lot to grow. DuPont shows which friend is which."},{"plain":"How many dollars of sales each dollar of assets produces in a year.","terms":[{"t":"Asset turnover","d":"revenue ÷ average total assets"},{"t":"Average total assets","d":"(opening + closing assets) ÷ 2"}],"use":"An efficiency measure, and the middle piece of DuPont analysis.","example":"A store chain has $500 of assets (stores, stock, cash) and sells $400 a year.\nAsset turnover = 400 ÷ 500 = 0.8x\nEach $1 of assets generates 80¢ of sales.","tip":"Supermarkets have high turnover (lots of sales, thin margins); utilities have very low turnover (huge assets).","like":"A food truck worth $50,000 sells $40,000 of food a year. Each $1 of truck and kit brings in 80¢ of sales."},{"plain":"How many dollars of assets the company has for each dollar of shareholders' money. The higher it is, the more the company is funded by debt.","terms":[{"t":"Average total assets","d":"(opening + closing assets) ÷ 2"},{"t":"Average shareholders' equity","d":"(opening + closing equity) ÷ 2"},{"t":"Leverage","d":"funding with borrowed money"}],"use":"The third piece of DuPont analysis: it shows how much debt is boosting ROE.","example":"A company has $500 of assets and $250 of equity.\nEquity multiplier = 500 ÷ 250 = 2.0x\nSo half the assets ($250) are funded by debt and other liabilities.","tip":"A multiplier of 1.0x means no liabilities at all; the higher it goes, the riskier.","like":"You buy a $500,000 house with $250,000 of your own money. The house is 2x your money; the rest is the bank's."},{"plain":"The average number of days customers take to pay you after a sale.","terms":[{"t":"DSO","d":"days sales outstanding"},{"t":"Accounts receivable (AR)","d":"money customers still owe you"},{"t":"Revenue","d":"total sales for the year"}],"use":"In a model you forecast AR with it: AR = Revenue × DSO ÷ 365. Rising DSO is a warning that customers are paying more slowly.","example":"A company sells $365 a year (about $1 a day) and is owed $50 by customers.\nDSO = 50 ÷ 365 × 365 = 50 days\nCustomers take about 50 days to pay on average.","tip":"Collecting cash faster (lower DSO) frees up cash for the business.","like":"If customers usually pay 50 days after you send the bill, your DSO is 50 days: that's how long your money is stuck with them."},{"plain":"The average number of days products sit in the warehouse before they're sold.","terms":[{"t":"DIO","d":"days inventory outstanding"},{"t":"Inventory","d":"goods waiting to be sold"},{"t":"COGS","d":"cost of the goods sold this year"}],"use":"In a model you forecast inventory with it: Inventory = COGS × DIO ÷ 365. Lower DIO means less cash tied up in stock.","example":"A shop's products cost $240 a year to buy, and it holds $60 of stock.\nDIO = 60 ÷ 240 × 365 ≈ 91 days\nProducts sit about 3 months before being sold.","tip":"Use COGS, not revenue, because inventory is recorded at cost.","like":"How long a T-shirt sits on the shelf before someone buys it. About 3 months? Then DIO is about 91 days."},{"plain":"The average number of days the company takes to pay its suppliers.","terms":[{"t":"DPO","d":"days payable outstanding"},{"t":"Accounts payable (AP)","d":"bills owed to suppliers"},{"t":"COGS","d":"cost of goods sold for the year"}],"use":"In a model you forecast AP with it: AP = COGS × DPO ÷ 365. Higher DPO means you hold on to cash longer.","example":"A company buys $240 of goods a year and owes suppliers $30.\nDPO = 30 ÷ 240 × 365 ≈ 46 days\nIt pays suppliers about 46 days after receiving goods.","tip":"Paying later helps cash flow, but stretching suppliers too much can damage relationships.","like":"How long you wait before paying the T-shirt supplier. Pay after about 46 days, and that's your DPO."},{"plain":"The number of days cash is tied up: from paying suppliers for goods to finally collecting cash from customers.","terms":[{"t":"DSO","d":"days to collect from customers"},{"t":"DIO","d":"days goods sit in inventory"},{"t":"DPO","d":"days you take to pay suppliers"}],"use":"Shows how much cash a business needs to fund its operations. A shorter cycle means less cash tied up in working capital.","example":"Goods sit 91 days before being sold (DIO), customers pay 50 days later (DSO), and you pay suppliers after 46 days (DPO).\nCash cycle = 91 + 50 − 46 = 95 days\nYour cash is tied up for about 3 months each cycle.","tip":"Some retailers have a NEGATIVE cycle: they get paid by customers before they pay suppliers.","like":"You pay your supplier on day 46, but your customer doesn't pay you until day 141. For 95 days you're out of pocket. That gap is the cash cycle."},{"plain":"Putting the same line items side by side across several years to see how they've changed.","terms":[{"t":"Horizontal analysis","d":"comparing across time periods"},{"t":"YoY","d":"year-over-year change"},{"t":"Growth rate","d":"(new − old) ÷ old"}],"use":"Used to spot trends: is revenue growing faster than costs? Are margins improving?","example":"Revenue was $100 last year and $120 this year.\nChange = (120 − 100) ÷ 100 = +20%\nCosts grew from 60 to 69, only +15%, so profitability improved.","tip":"Horizontal = across years (left to right). Vertical = within one year (top to bottom).","like":"Putting January's and February's bank statements side by side: \"I spent 20% more on food this month.\""},{"plain":"Showing every line of a financial statement as a percentage of one total in the same year, so companies of different sizes can be compared.","terms":[{"t":"Vertical analysis","d":"each line ÷ a base figure"},{"t":"Common-size statement","d":"a statement where every line is a %"},{"t":"Base","d":"revenue for the income statement, total assets for the balance sheet"}],"use":"Lets you compare a small company with a giant one, or see how a company's cost structure changes over time.","example":"This year: revenue $120, COGS $69, gross profit $51.\nCOGS = 69 ÷ 120 = 58% of revenue\nGross profit = 51 ÷ 120 = 42% of revenue","tip":"Income statement lines → % of revenue. Balance sheet lines → % of total assets.","like":"Looking at one month as a pie chart: rent is 40% of my income, food 15%, fun 10%."},{"plain":"The profit that belongs to common shareholders, divided by the number of shares.","terms":[{"t":"EPS","d":"earnings per share"},{"t":"Preferred dividends","d":"paid to preferred shareholders before common shareholders"},{"t":"Weighted average shares","d":"the average number of shares during the year"}],"use":"Used in the P/E ratio and to judge whether an acquisition increases (accretive) or decreases (dilutive) the buyer's EPS.","example":"A company earns $105 and pays $5 of preferred dividends. It had 50 shares on average.\nProfit for common shareholders = 105 − 5 = $100\nEPS = 100 ÷ 50 = $2.00 per share","tip":"Diluted EPS also counts shares that could be created from options and convertibles, so it's lower.","like":"A pizza place makes $100 of profit and is split into 50 shares. Each share \"earns\" $2."},{"plain":"When a company has a lot of fixed costs, a small change in sales causes a much bigger change in operating profit, in both directions.","terms":[{"t":"Fixed costs","d":"costs that don't change with sales (rent, salaries)"},{"t":"Variable costs","d":"costs that rise with each unit sold (materials)"},{"t":"EBIT","d":"operating profit"}],"use":"Helps you understand risk in a forecast: high-fixed-cost businesses (airlines, factories) see profits swing much more than sales.","example":"Revenue $100, variable costs $40, fixed costs $50 → EBIT $10.\nSales rise 10%: revenue 110, variable costs 44, fixed still 50 → EBIT $16.\nA 10% rise in sales lifted EBIT by 60%.","tip":"It works both ways: in a downturn, profits fall much faster than sales.","like":"A gym pays the same rent whether 100 or 200 people sign up. Once rent is covered, almost every extra member is pure profit, so profit grows much faster than sign-ups (and falls faster too)."}],"fmva-cf":[{"plain":"How much money you have today will grow to in the future if it earns interest, and the interest itself also earns interest (compounding).","terms":[{"t":"FV","d":"future value, what it grows to"},{"t":"PV","d":"present value, what you have today"},{"t":"r","d":"interest rate per period"},{"t":"n","d":"number of periods"}],"use":"The base of all time-value-of-money math, used to project how investments and savings grow.","example":"You put $1,000 in an account paying 5% a year for 3 years.\nYear 1: 1,000 × 1.05 = 1,050\nYear 2: 1,050 × 1.05 = 1,102.50\nYear 3: 1,102.50 × 1.05 = $1,157.63 (same as 1,000 × 1.05³)","tip":"Keep r and n in the same units: for monthly compounding, use a monthly rate and the number of months.","like":"Put $1,000 in a savings account at 5% and come back in 3 years: it's grown to $1,157.63, because the interest also earns interest, like a snowball rolling downhill."},{"plain":"What money you'll receive in the future is worth in today's money. A dollar later is worth less than a dollar now, because today's dollar could be invested.","terms":[{"t":"PV","d":"present value, today's equivalent"},{"t":"FV","d":"future value, the amount received later"},{"t":"r","d":"discount rate, the return you could earn elsewhere"},{"t":"n","d":"number of periods until you receive it"}],"use":"Discounting future cash flows back to today is the heart of every DCF valuation.","example":"Someone promises you $1,157.63 in 3 years. You could earn 5% elsewhere.\nPV = 1,157.63 ÷ 1.05³ = 1,157.63 ÷ 1.1576 = $1,000\nSo that promise is worth $1,000 to you today.","tip":"The higher the discount rate, the less future money is worth today.","like":"Would you rather have $1,000 today or $1,157 in 3 years? If your bank pays 5%, they're worth the same. PV tells you what future money is worth right now."},{"plain":"Take all the cash an investment will bring in the future, convert it into today's money, then subtract what it costs today. If what's left is positive, the investment adds value.","terms":[{"t":"NPV","d":"net present value"},{"t":"Discounting","d":"converting future cash into today's money"},{"t":"Initial investment","d":"what you pay at the start (\"year 0\")"}],"use":"The main tool companies use to decide whether to go ahead with a project, and the logic behind DCF valuation.","example":"A machine costs $100 today and will bring in $60 in each of the next 2 years. Your required return is 10%.\nYear 1: 60 ÷ 1.10 = 54.5\nYear 2: 60 ÷ 1.10² = 49.6\nNPV = 54.5 + 49.6 − 100 = +4.1 → worth doing","tip":"Excel's NPV() treats the first number as year 1, so subtract the year-0 cost outside the formula.","like":"Should you buy a $100 coffee machine that saves you $60 a year for 2 years? Convert those future savings into today's money and compare with $100. If you come out ahead, buy it."},{"plain":"If NPV is positive, the project earns more than investors require, so it creates value: do it. If negative, it destroys value: don't.","terms":[{"t":"NPV > 0","d":"returns beat the required return"},{"t":"NPV < 0","d":"returns fall short of the required return"},{"t":"Mutually exclusive","d":"you can only choose one of the projects"}],"use":"The basic decision rule for spending money on projects (capital budgeting).","example":"Project A has an NPV of +$4.1m → accept.\nProject B has an NPV of −$2m → reject.\nIf you can only pick one of two positive projects, pick the one with the higher NPV.","tip":"When choosing between projects, pick the highest NPV, not the highest IRR.","like":"If a deal leaves you better off in today's money, take it. If it leaves you worse off, walk away."},{"plain":"The rate of return a project earns, found as the discount rate that makes its NPV exactly zero.","terms":[{"t":"IRR","d":"internal rate of return"},{"t":"NPV = 0","d":"the discounted cash coming in exactly equals the cost"},{"t":"Discount rate","d":"the rate used to bring future cash back to today"}],"use":"Expresses a project's or deal's return as a simple percentage. Private equity funds report their returns as IRR.","example":"You invest $100 today and get $110 back in exactly one year.\nAt a 10% discount rate: 110 ÷ 1.10 = 100, so NPV = 0\nIRR = 10%","tip":"IRR can be misleading for projects of very different sizes or with cash flows that switch between positive and negative.","like":"Lend a friend $100, get $110 back in a year: you earned 10%. IRR is that \"interest rate\" for any investment, even messy ones."},{"plain":"Go ahead if the project's return (IRR) is higher than the minimum return investors require.","terms":[{"t":"Hurdle rate","d":"the minimum return required to accept a project"},{"t":"Cost of capital","d":"what investors expect to earn, often WACC"},{"t":"IRR","d":"the project's own rate of return"}],"use":"A quick go/no-go screen for projects and investments.","example":"A project has an IRR of 14%. The company's WACC is 9%.\n14% > 9% → accept\nIf its IRR were 7%, you'd reject it.","tip":"If NPV and IRR give different answers, trust NPV.","like":"If an investment earns 14% and the money costs you 9%, do it: you keep the difference."},{"plain":"The average yearly return a company must give everyone who funds it (shareholders and lenders), weighted by how much of each it uses.","terms":[{"t":"E","d":"market value of equity"},{"t":"D","d":"market value of debt"},{"t":"Re","d":"cost of equity, the return shareholders expect"},{"t":"Rd","d":"cost of debt, the interest rate on borrowing"},{"t":"Tax rate","d":"the company's tax rate, used because interest reduces tax"}],"use":"WACC is the discount rate you use on unlevered free cash flows in a DCF to find enterprise value.","example":"A company is funded 60% by equity and 40% by debt. Shareholders expect 10%; debt costs 5%; tax rate is 25%.\nEquity part: 0.60 × 10% = 6.0%\nDebt part: 0.40 × 5% × (1 − 0.25) = 1.5%\nWACC = 6.0% + 1.5% = 7.5%","tip":"Use market values for the weights where possible, not book values from the balance sheet.","like":"You fund a business 60% with investors who want 10% back and 40% with a bank loan at 5% (less after tax). WACC is the average \"rent\" you pay on all that money."},{"plain":"Interest on debt is subtracted before tax is calculated, so borrowing lowers the company's tax bill. That makes debt cheaper than its interest rate suggests.","terms":[{"t":"Tax shield","d":"the tax saved because interest is tax-deductible"},{"t":"After-tax cost of debt","d":"Rd × (1 − tax rate)"},{"t":"Tax-deductible","d":"can be subtracted from income before tax"}],"use":"It's why WACC multiplies the cost of debt by (1 − tax rate).","example":"A company borrows at 6%. Its tax rate is 25%.\nFor every $100 of interest, it pays $25 less tax.\nAfter-tax cost of debt = 6% × (1 − 0.25) = 4.5%","tip":"Dividends to shareholders are NOT tax-deductible, so the cost of equity gets no tax adjustment.","like":"You pay $100 of interest, and because of it you pay $25 less tax. So the loan really costs you only $75."},{"plain":"CAPM says shareholders expect the risk-free return, plus extra compensation for how risky the stock is compared with the overall market.","terms":[{"t":"Re","d":"cost of equity, the return shareholders expect"},{"t":"Rf","d":"risk-free rate, e.g. a government bond yield"},{"t":"β (beta)","d":"how much the stock moves compared with the market"},{"t":"Rm − Rf","d":"equity risk premium, the extra return of stocks over safe bonds"}],"use":"The standard way to estimate the cost of equity, which goes into WACC.","example":"Government bonds yield 4%. The stock's beta is 1.2. Stocks are expected to beat bonds by 5%.\nRe = 4% + 1.2 × 5%\nRe = 4% + 6% = 10%","tip":"Multiply beta by the premium (Rm − Rf), not by the market return (Rm) itself.","like":"A safe government bond pays 4%. A stock is riskier, so investors want 4% plus extra pay for the risk. CAPM works out how much extra."},{"plain":"Beta measures how much a stock tends to move when the overall market moves.","terms":[{"t":"β = 1","d":"moves in line with the market"},{"t":"β > 1","d":"moves more than the market (riskier)"},{"t":"β < 1","d":"moves less than the market (calmer)"}],"use":"Beta goes into CAPM: the higher the beta, the higher the cost of equity, and the lower the valuation.","example":"The market rises 10%.\nA stock with β 1.5 rises about 15% on average.\nA stock with β 0.5 rises about 5%.\n(And they fall by those amounts when the market falls.)","tip":"For a private company, use the betas of similar public companies, adjusted for the target's debt level.","like":"Some stocks are calm, some are rollercoasters. If the market rises 10% and a stock usually rises 15%, its beta is 1.5."},{"plain":"The extra yearly return investors expect for owning stocks instead of risk-free government bonds.","terms":[{"t":"Rm","d":"expected return of the stock market"},{"t":"Rf","d":"risk-free rate (government bond yield)"},{"t":"Equity risk premium","d":"Rm − Rf"}],"use":"It's multiplied by beta in CAPM to get the cost of equity.","example":"Stocks are expected to return 9% a year. Government bonds yield 4%.\nEquity risk premium = 9% − 4% = 5%","tip":"Typical assumptions are around 4–6%; check which one your course or firm uses.","like":"If safe bonds pay 4% and stocks are expected to pay 9%, the extra 5% is your reward for putting up with the stock market's ups and downs."},{"plain":"A payment that continues forever is worth the yearly payment divided by the discount rate.","terms":[{"t":"Perpetuity","d":"equal payments that never end"},{"t":"Cash flow","d":"the yearly payment"},{"t":"r","d":"discount rate"}],"use":"The basic building block of terminal value in a DCF.","example":"An investment pays $100 a year forever. Your required return is 5%.\nValue today = 100 ÷ 0.05 = $2,000\n(Check: $2,000 earning 5% produces exactly $100 a year.)","tip":"Only works when the rate is above zero.","like":"How much would you pay today for $100 every year, forever? If you could earn 5% elsewhere, $2,000, because $2,000 at 5% pays exactly $100 a year."},{"plain":"The same as a perpetuity, except the payment grows at a steady rate every year, forever.","terms":[{"t":"CF₁","d":"the cash flow NEXT year"},{"t":"r","d":"discount rate"},{"t":"g","d":"growth rate, must be lower than r"}],"use":"This \"Gordon growth\" formula is how the perpetuity-growth terminal value in a DCF is calculated.","example":"A business will pay $100 next year, growing 3% a year forever. Your required return is 8%.\nValue = 100 ÷ (0.08 − 0.03)\nValue = 100 ÷ 0.05 = $2,000","tip":"Use NEXT year's cash flow (CF₁). If you only have this year's, multiply it by (1 + g) first.","like":"The same, but the $100 grows a little every year, like rent that rises with inflation. That growth makes it worth more today."},{"plain":"The same payment every period for a set number of periods, like car loan or mortgage payments.","terms":[{"t":"Annuity","d":"equal payments for a fixed number of periods"},{"t":"Ordinary annuity","d":"payments at the end of each period"},{"t":"Annuity due","d":"payments at the start of each period"}],"use":"Used for loans, leases and bonds; Excel's PMT and PV functions are built on it.","example":"You'll receive $100 at the end of each of the next 3 years. Rate is 5%.\nYear 1: 100 ÷ 1.05 = 95.24\nYear 2: 100 ÷ 1.05² = 90.70\nYear 3: 100 ÷ 1.05³ = 86.38\nValue today = $272.32","tip":"An annuity due is worth more, because each payment arrives one period sooner.","like":"Car payments: the same $300 every month for 4 years. That's an annuity."},{"plain":"A quick mental shortcut: divide 72 by the yearly return to estimate how many years it takes money to double.","terms":[{"t":"Rate","d":"yearly return as a whole number (use 8 for 8%)"},{"t
